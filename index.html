    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        @font-face { font-family: 'Unbounded'; font-weight: 800; font-display: swap; src: url(assets/fonts/unbounded-latin-800-normal.woff2) format('woff2'); }
        @font-face { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400; font-display: swap; src: url(assets/fonts/instrument-serif-latin-400-italic.woff2) format('woff2'); }
        @font-face { font-family: 'JetBrains Mono'; font-weight: 400; font-display: swap; src: url(assets/fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2'); }
        @font-face { font-family: 'JetBrains Mono'; font-weight: 600; font-display: swap; src: url(assets/fonts/jetbrains-mono-latin-600-normal.woff2) format('woff2'); }
        @font-face { font-family: 'DSEG14'; font-weight: 400; font-display: block; src: url(assets/fonts/DSEG14Classic-Regular.woff2) format('woff2'); }
        :root {
            --bg: #0b0c0b;
            --border: rgba(236, 235, 226, 0.12);
            --text: #ecebe2;
            --border-width: 1px;
            --silver: #ecebe2;
            --silver2: #c9cac1;
            --dim: rgba(236, 235, 226, 0.64);
            --faint: rgba(236, 235, 226, 0.36);
            --line: rgba(236, 235, 226, 0.12);
            --lcd: #b5bba8;
            --lcd-hi: #c6ccb8;
            --seg: #1c211b;
            --gold: #c7a346;
            --red: #b8362c;
            --chrome: linear-gradient(180deg, #ffffff 0%, #f1f0e8 30%, #a9aaa2 49%, #6d6f69 52%, #d9d9d0 66%, #ffffff 84%, #b4b5ad 100%);
            --steel: linear-gradient(180deg, #f4f4ee 0%, #cfd0c8 45%, #9a9c95 55%, #e0e1da 100%);
            --f-d: 'Unbounded', 'Arial Black', sans-serif;
            --f-s: 'Instrument Serif', Georgia, serif;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;
            --f-seg: 'DSEG14', 'JetBrains Mono', monospace;
            --ease: cubic-bezier(.22, 1, .36, 1);
        }
        html,
        body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        * {
            border: var(--border-width) solid var(--border);
        }
        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bg);
            border: var(--border-width) solid var(--border);
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            border: var(--border-width) solid var(--border);
            background: transparent;
        }
        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            border: none;
            background: transparent;
        }

        .chip, .chip *, .chaos-hud, .chaos-hud *, #plymouth, #plymouth * { border: 0; }
        .chip {
            position: fixed;
            bottom: 1.2em;
            z-index: 99;
            display: grid;
            grid-template-columns: auto auto;
            align-items: center;
            gap: 0 8px;
            padding: 6px 10px;
            border-radius: 6px;
            max-width: calc(50vw - 2.4em);
            background: linear-gradient(180deg, var(--lcd-hi), var(--lcd));
            box-shadow: inset 0 1px 3px rgba(0,0,0,.45), 0 0 0 2px #202220, 0 0 0 3px #7c7f78, 0 10px 30px rgba(0,0,0,.45);
            font-family: var(--font-mono);
            color: var(--seg);
        }
        .lcd-lbl { font: 600 7.5px/1 var(--font-mono); letter-spacing: .18em; color: rgba(28,33,27,.6); text-transform: uppercase; }
        .seg { font-family: var(--f-seg); color: var(--seg); letter-spacing: .06em; }
        .chip .seg { font-size: 11px; }
        .chip-val { font: 600 9.5px/1.2 var(--font-mono); letter-spacing: .04em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        #seed-display {
            right: 1.6em;
            pointer-events: auto;
            user-select: all;
            cursor: pointer;
            transition: filter .2s ease, transform .15s ease;
        }
        #seed-display:hover { filter: brightness(1.06); }
        #seed-display:active { transform: translateY(1px); }
        #visitor-count {
            left: 1.6em;
            pointer-events: none;
            user-select: none;
        }
        .chaos-hud {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 99;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px clamp(16px, 3vw, 40px) 26px;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(10,11,10,.85) 0%, rgba(10,11,10,.5) 55%, rgba(10,11,10,0) 100%);
        }
        .chaos-hud > * { pointer-events: auto; }
        .embedded .chaos-hud { display: none; }
        .brand { display: flex; align-items: center; gap: 12px; color: var(--silver); text-decoration: none; font: 800 13px/1 var(--f-d); letter-spacing: .32em; white-space: nowrap; }
        .brand-sub { font: 600 10px/1 var(--font-mono); letter-spacing: .24em; color: var(--faint); }
        .chrome-t { background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .logo { display: block; height: 36px; width: auto; flex: none; overflow: visible; }
        .hud-keys { display: flex; gap: 8px; }
        .key {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            height: 32px; padding: 0 13px; border-radius: 8px;
            font: 600 9.5px/1 var(--font-mono); letter-spacing: .2em; color: #1b1c1a; text-transform: uppercase; text-decoration: none; cursor: pointer;
            background: linear-gradient(180deg, #fbfbf6 0%, #d6d7cf 46%, #a3a59d 54%, #e1e2da 100%);
            box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.5);
            transition: transform .15s, filter .2s;
        }
        .key:hover { filter: brightness(1.07); }
        .key:active { transform: translateY(1px); }
        .key .ink-red { color: #8f2219; }

        ::-webkit-scrollbar {
            display: none;
        }
        @media (max-width: 600px) {
            .chip {
                padding: 5px 8px;
                bottom: 0.8em;
            }
            .chip .seg { font-size: 9px; }
            .brand { font-size: 11px; letter-spacing: .24em; gap: 10px; }
            .brand-sub { display: none; }
            .logo { height: 30px; }
            .key .k-txt { display: none; }
            #visitor-count {
                left: 0.8em;
            }
            #seed-display {
                right: 0.8em;
            }
        }

        /* ---- BOOT POSTER: full-bleed two-colour field, the dimension's stats typeset over it ---- */
        #plymouth {
            position: fixed;
            inset: 0;
            z-index: 1000;
            overflow: hidden;
            background: #0b0c0b;
            font-family: var(--font-mono);
            transition: opacity 1s ease, visibility 0s linear 1s;
            opacity: 1;
            pointer-events: none;
            --ba: #2b2d2a;            /* colour A of the dimension, set by the module once the seed is hashed */
            --bb: #ecebe2;            /* colour B */
        }
        #plymouth.hide { opacity: 0; visibility: hidden; }
        #ply-canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
        #ply-grain { position: absolute; inset: 0; opacity: .08; background-repeat: repeat; background-size: 200px 200px; }
        .po-ink { color: #fff; mix-blend-mode: difference; }          /* white knocked through the field: inverts whatever is behind it */
        .po-top, .po-side, .po-log, .po-steps { mix-blend-mode: normal; color: var(--silver); text-shadow: 0 1px 12px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.9); }   /* small type stays legible on the bright patches */
        .po-top .po-pct { mix-blend-mode: difference; text-shadow: none; color: #fff; }
        .po-top {
            position: absolute; top: 0; left: 0; right: 0;
            display: flex; justify-content: space-between; align-items: flex-start;
            padding: clamp(16px, 3vw, 36px);
            font: 600 10px/1 var(--font-mono); letter-spacing: .28em; text-transform: uppercase;
        }
        .po-brand { display: flex; align-items: center; gap: 12px; }
        .po-brand .logo { height: 30px; width: auto; }
        .po-brand .logo path, .po-brand .logo rect { stroke: #fff; }
        .po-brand .logo rect { fill: #fff; }
        .po-brand em { font-style: normal; opacity: .55; margin-left: 6px; }
        .po-pct { font: 800 clamp(28px, 5vw, 60px)/1 var(--f-d); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
        .po-pct small { font-size: .45em; vertical-align: .6em; letter-spacing: 0; }
        .po-side {
            position: absolute; left: clamp(14px, 3vw, 36px); top: 50%;
            transform: translateY(-50%) rotate(180deg);
            writing-mode: vertical-rl;
            font: 500 9px/1 var(--font-mono); letter-spacing: .22em; text-transform: uppercase; white-space: nowrap;
        }
        .po-main { position: absolute; left: clamp(40px, 7vw, 110px); right: clamp(16px, 3vw, 36px); top: 50%; transform: translateY(-56%); }
        .po-word {
            font: 800 clamp(54px, 13vw, 200px)/.88 var(--f-d);
            letter-spacing: -.045em; text-transform: uppercase; overflow-wrap: anywhere;
            animation: word-in .55s var(--ease);
        }
        @keyframes word-in { from { transform: translateX(-.08em) skewX(-6deg); letter-spacing: .02em; } to { transform: none; letter-spacing: -.045em; } }
        .po-sub { margin-top: clamp(10px, 1.6vw, 18px); font: italic 400 clamp(17px, 2.4vw, 30px)/1.25 var(--f-s); color: var(--silver); text-shadow: 0 2px 22px rgba(0,0,0,.7); max-width: 34em; }
        .po-log {
            position: absolute; right: clamp(16px, 3vw, 36px); bottom: clamp(58px, 10vh, 100px);
            text-align: right; max-width: 58vw;
            font: 500 10px/1.9 var(--font-mono); letter-spacing: .08em;
        }
        .po-log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: log-in .3s ease-out; }
        .po-log b { font-weight: 600; opacity: .5; margin-right: 1.2em; }
        @keyframes log-in { from { transform: translateY(5px); } to { transform: none; } }
        .po-steps {
            position: absolute; left: clamp(16px, 3vw, 36px); bottom: clamp(24px, 5vh, 46px);
            display: flex; gap: clamp(8px, 1.6vw, 22px);
            font: 600 9px/1 var(--font-mono); letter-spacing: .2em;
        }
        .po-steps span { opacity: .28; transition: opacity .3s; }
        .po-steps span.done { opacity: 1; }
        .po-steps span.now { opacity: 1; animation: po-blink 1s steps(2, start) infinite; }
        @keyframes po-blink { to { opacity: .2; } }
        .po-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.1); }
        .po-bar div { height: 100%; width: 0; background: var(--bb); box-shadow: 0 0 18px var(--bb); transition: width .6s var(--ease); }
        @media (max-width: 600px) {
            .po-log, .po-side { display: none; }
            .po-main { left: 16px; right: 16px; }
            .po-steps { flex-wrap: wrap; gap: 8px 12px; right: 16px; }
            .po-brand em { display: none; }
        }
    </style>
</head>

    <script>
        (function () {
            const g = document.getElementById('ply-grain');
            if (!g) return;
            const c = document.createElement('canvas');
            c.width = c.height = 200;
            const x = c.getContext('2d'), d = x.createImageData(200, 200), p = d.data;
            for (let i = 0; i < p.length; i += 4) { const v = Math.random() < 0.5 ? 0 : 255; p[i] = p[i + 1] = p[i + 2] = v; p[i + 3] = Math.random() * 56; }
            x.putImageData(d, 0, 0);
            g.style.backgroundImage = 'url(' + c.toDataURL('image/png') + ')';
        })();
    </script>

    <script>
        // BOOT POSTER — no fake timer. The module reports its real stages through
        // window.__BOOT (seed hashed, mood, palette, shape, lineage, satellites, shaders,
        // first frame); each one lands as a huge word over a two-colour field that
        // recolours itself to the dimension the moment its palette is known. Stages are
        // queued so they read at a human pace even though the module builds in one burst.
        (function(){
            const plymouth = document.getElementById('plymouth');
            const bar      = document.getElementById('boot-bar-fill');
            const wordEl   = document.getElementById('boot-word');
            const status   = document.getElementById('boot-status');
            if (!plymouth || !bar || !wordEl || !status) return;
            const pctEl  = document.getElementById('boot-pct');
            const logEl  = document.getElementById('boot-log');
            const seedEl = document.getElementById('boot-seed');
            const steps  = Array.from(document.querySelectorAll('#boot-steps span'));
            const canvas = document.getElementById('ply-canvas');

            const T0 = performance.now(), MIN_SHOW = 2600, GAP = 260;
            const queue = []; let busy = false, finished = false, failed = false, running = true;
            let shown = 0, target = 0, step = -1, last = performance.now();

            function count(now) {
                const dt = Math.min(200, now - last); last = now;
                if (shown < target) { shown = Math.min(target, shown + Math.max(1, Math.round(dt * 0.14))); if (pctEl) pctEl.textContent = String(shown).padStart(3, '0'); }
                if (running) requestAnimationFrame(count);
            }
            requestAnimationFrame(count);

            let wordNode = wordEl;
            function setWord(w) {
                const n = wordNode.cloneNode(false);         // a fresh node restarts the entrance animation
                n.textContent = w; wordNode.replaceWith(n); wordNode = n;
            }
            function addLog(key, val) {
                if (!logEl) return;
                const line = document.createElement('div');
                const k = document.createElement('b'); k.textContent = key;
                line.appendChild(k); line.appendChild(document.createTextNode(val));
                logEl.appendChild(line);
                while (logEl.children.length > 5) logEl.removeChild(logEl.firstChild);
            }
            function markStep(i) {
                steps.forEach((s, j) => { s.classList.toggle('done', j < i); s.classList.toggle('now', j === i); });
            }
            function apply(s) {
                if (s.done) { finish(); return; }
                target = s.pct; bar.style.width = s.pct + '%';
                setWord(s.word);
                status.textContent = s.detail || '';
                step = Math.min(steps.length - 1, step + 1); markStep(step);
                if (s.key) addLog(s.key, s.detail);
                if (s.key === 'SEED' && seedEl) seedEl.textContent = 'SEED  ' + s.detail;
            }
            function flush() {
                if (busy || failed || !queue.length) return;
                busy = true; apply(queue.shift());
                setTimeout(() => { busy = false; flush(); }, GAP);
            }
            function finish() {
                if (finished || failed) return; finished = true;
                const wait = Math.max(0, MIN_SHOW - (performance.now() - T0));
                setTimeout(() => {
                    target = 100; shown = 100; bar.style.width = '100%';
                    if (pctEl) pctEl.textContent = '100';
                    setWord('READY'); status.textContent = 'a new dimension, every reload';
                    steps.forEach(s => { s.classList.add('done'); s.classList.remove('now'); });
                    setTimeout(() => {
                        plymouth.classList.add('hide');
                        setTimeout(() => { plymouth.style.display = 'none'; running = false; }, 1100);
                    }, 520);
                }, wait);
            }
            function fail(msg) {
                if (finished) return; failed = true;
                setWord('COLLAPSED'); status.textContent = String(msg || 'unknown error').slice(0, 120);
                plymouth.style.pointerEvents = 'auto';
            }

            // ---- the field: a tiny domain-warped pattern painted through the same 4-stop
            // two-colour ramp the real duotone pass uses, upscaled with hard pixels ----
            const W = 160, H = 100;
            let ctx = null, img = null, px = null;
            if (canvas) { canvas.width = W; canvas.height = H; ctx = canvas.getContext('2d'); img = ctx.createImageData(W, H); px = img.data; }
            const colA = [43, 45, 42], colB = [236, 235, 226], tgtA = colA.slice(), tgtB = colB.slice();
            const rot = Math.random() * 6.28, dens = 1.2 + Math.random() * 1.4;
            function hex(h) { const n = parseInt(h.replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
            function setPalette(a, b) {
                const A = hex(a), B = hex(b);
                for (let i = 0; i < 3; i++) { tgtA[i] = A[i]; tgtB[i] = B[i]; }
                plymouth.style.setProperty('--ba', a); plymouth.style.setProperty('--bb', b);
            }
            function paint(now) {
                if (!running) return;
                requestAnimationFrame(paint);
                if (!ctx) return;
                const t = now * 0.001;
                for (let i = 0; i < 3; i++) { colA[i] += (tgtA[i] - colA[i]) * 0.05; colB[i] += (tgtB[i] - colB[i]) * 0.05; }
                const k0 = colA.map(c => c * 0.05), k3 = colB.map(c => c + (255 - c) * 0.35);
                const cr = Math.cos(rot), sr = Math.sin(rot);
                let o = 0;
                for (let y = 0; y < H; y++) {
                    for (let x = 0; x < W; x++) {
                        let u = (x / W - 0.5) * 3.2 * dens, v = (y / H - 0.5) * 2.0 * dens;
                        const ru = u * cr - v * sr, rv = u * sr + v * cr; u = ru; v = rv;
                        const a = Math.sin(u * 2.0 + t * 0.6 + Math.sin(v * 2.4 - t * 0.5) * 1.3);
                        const b = Math.cos(v * 2.2 - t * 0.45 + Math.sin(u * 1.7 + t * 0.35) * 1.4);
                        let l = 0.5 + 0.5 * Math.sin(a * 2.4 + b * 2.4 + t * 0.4);
                        l = Math.pow(l, 1.3) * (0.55 + 0.45 * (0.5 + 0.5 * Math.cos(u * 3.0 + b * 2.0 - t * 0.3)));
                        let r, g, bl;
                        if (l < 0.35) { const f = l / 0.35; r = k0[0] + (colA[0] - k0[0]) * f; g = k0[1] + (colA[1] - k0[1]) * f; bl = k0[2] + (colA[2] - k0[2]) * f; }
                        else if (l < 0.78) { const f = (l - 0.35) / 0.43; r = colA[0] + (colB[0] - colA[0]) * f; g = colA[1] + (colB[1] - colA[1]) * f; bl = colA[2] + (colB[2] - colA[2]) * f; }
                        else { const f = (l - 0.78) / 0.22; r = colB[0] + (k3[0] - colB[0]) * f; g = colB[1] + (k3[1] - colB[1]) * f; bl = colB[2] + (k3[2] - colB[2]) * f; }
                        px[o++] = r; px[o++] = g; px[o++] = bl; px[o++] = 255;
                    }
                }
                ctx.putImageData(img, 0, 0);
            }
            requestAnimationFrame(paint);

            window.__BOOT = {
                stage(pct, word, key, detail) { queue.push({ pct, word, key, detail }); flush(); },
                palette: setPalette,
                done() { queue.push({ done: true }); flush(); },
                fail,
            };
            window.addEventListener('error', e => fail(e.message));
            window.addEventListener('unhandledrejection', e => fail(e.reason && e.reason.message || e.reason));
            // if the module never reports in (blocked CDN, old browser), don't leave the poster up forever
            setTimeout(() => { if (!finished && !failed) { addLog('WARN', 'no report from the module'); finish(); } }, 15000);
        })();
    </script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from "three";
        import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
        import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
        import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
        import { AfterimagePass } from "three/addons/postprocessing/AfterimagePass.js";
        import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
        import { FilmPass } from "three/addons/postprocessing/FilmPass.js";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { mergeGeometries, mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";
        import { ParametricGeometry } from "three/addons/geometries/ParametricGeometry.js";

        let visitorCount = parseInt(localStorage.getItem('chaos_visitors') || '0');
        visitorCount++;
        localStorage.setItem('chaos_visitors', String(visitorCount));
        document.getElementById('visitor-num').textContent = String(visitorCount).padStart(4, '0');

        const BASE_SEED = '00412155298475701556600976144290864552605910218295420071954111534368688774931460214873457683422516115080354828163038077682640013';
        const SEED_RAW = BASE_SEED + String(visitorCount).padStart(10, '0');

        function splitmix64(a) {
            return function() {
                a = (a + 0x9e3779b97f4a7c15n) & 0xffffffffffffffffn;
                let z = a;
                z = ((z ^ (z >> 30n)) * 0xbf58476d1ce4e5b9n) & 0xffffffffffffffffn;
                z = ((z ^ (z >> 27n)) * 0x94d049bb133111ebn) & 0xffffffffffffffffn;
                return Number((z ^ (z >> 31n)) & 0xffffffffffffffffn) / 18446744073709551616;
            };
        }

        // Fold EVERY character of the seed into the 64-bit state. The old version
        // shifted 8 bits per char under a 64-bit mask, so each half only remembered
        // its last 8 chars and the two halves were XORed with a 32-bit offset —
        // which left exactly visitorCount % 10000 distinct dimensions and ignored
        // the daily seed entirely. This is FNV-1a (64-bit) over the whole string,
        // then one SplitMix64 finaliser so neighbouring counts land far apart.
        function seedTo64(s) {
            const M = 0xffffffffffffffffn;
            const str = String(s);
            let h = 0xcbf29ce484222325n;                       // FNV offset basis
            for (let i = 0; i < str.length; i++) {
                h ^= BigInt(str.charCodeAt(i));
                h = (h * 0x100000001b3n) & M;                  // FNV prime
            }
            // finaliser: full 64-bit avalanche so every input bit touches every output bit
            h = (h ^ (h >> 30n)) * 0xbf58476d1ce4e5b9n & M;
            h = (h ^ (h >> 27n)) * 0x94d049bb133111ebn & M;
            return h ^ (h >> 31n);
        }

        const seed64 = seedTo64(SEED_RAW);
        const BOOT = window.__BOOT || { stage() {}, palette() {}, done() {} };
        BOOT.stage(10, 'SEEDED', 'SEED', '0x' + seed64.toString(16).padStart(16, '0') + '  ·  visitor ' + visitorCount);
        const rng = splitmix64(seed64);
        // A second, independent stream for things that happen *while* the scene runs
        // (palette jumps), so runtime randomness never disturbs construction order.
        const runtimeRng = splitmix64((seed64 ^ 0x5eed0fbead5eed5n) & 0xffffffffffffffffn);

        // =====================================================================
        //  MOOD ENGINE — one seeded scalar, 0 (calm) → 1 (wild), that every
        //  eye-strain effect reads from: film grain, duotone dither, how often
        //  the palette jumps, how often a jump is a hard cut, the flash and the
        //  flinch that land with it, afterimage trail length and bloom.
        //  Third independent stream so it never disturbs construction or the
        //  palette schedule. Most seeds land calm/soft; a few go wild.
        //  Overrides: ?calm=1, ?mood=0..1. Cycle live with the M key.
        // =====================================================================
        const moodRng = splitmix64((seed64 ^ 0x4d00d4d00d4d00dn) & 0xffffffffffffffffn);
        const MOOD_NAMES = ['CALM', 'SOFT', 'LIVELY', 'WILD'];
        const MOOD_STOPS = [0.05, 0.35, 0.65, 0.95];
        const mood = { v: Math.pow(moodRng(), 1.6), target: 0, locked: false };
        {
            const qp = new URLSearchParams(location.search);
            if (qp.has('calm')) { mood.v = 0.05; mood.locked = true; }
            if (qp.has('mood')) {
                const m = parseFloat(qp.get('mood'));
                if (Number.isFinite(m)) { mood.v = Math.min(1, Math.max(0, m)); mood.locked = true; }
            }
            mood.target = mood.v;
        }
        function moodIndex(v) { return Math.min(MOOD_NAMES.length - 1, Math.floor(v * MOOD_NAMES.length)); }
        function moodName(v) { return MOOD_NAMES[moodIndex(v)]; }
        // every effect asks for its calm value and its wild value; the mood picks the point between
        function ml(calm, wild) { return calm + (wild - calm) * mood.v; }
        function cycleMood() {
            mood.target = MOOD_STOPS[(moodIndex(mood.target) + 1) % MOOD_STOPS.length];
            updateMoodLabel();
        }
        function updateMoodLabel() {
            const el = document.getElementById('mood-txt');
            if (el) el.textContent = moodName(mood.target);
        }
        function updateMood(dt) {
            // ease toward the target so a key press is a slow exhale, not a cut
            mood.v += (mood.target - mood.v) * Math.min(1, dt * 1.5);
        }
        updateMoodLabel();
        BOOT.stage(20, moodName(mood.v), 'MOOD', 'mood ' + mood.v.toFixed(2) + (mood.locked ? '  ·  pinned by url' : '  ·  seeded'));
        document.getElementById('mood-key')?.addEventListener('click', cycleMood);
        window.addEventListener('keydown', (e) => {
            if (e.key === 'm' || e.key === 'M') { if (!e.metaKey && !e.ctrlKey && !e.altKey) cycleMood(); }
        });

        const seedDisplay = document.getElementById('seed-display');
        const seedVal = document.getElementById('seed-val');

        function updateSeedDisplay() {
            if (window.innerWidth <= 600) {
                seedVal.textContent = SEED_RAW.slice(0, 10) + '…' + SEED_RAW.slice(-6);
            } else {
                seedVal.textContent = SEED_RAW.slice(0, 32) + '…' + SEED_RAW.slice(-10);
            }
        }

        updateSeedDisplay();

        seedDisplay.addEventListener('click', () => {
            navigator.clipboard.writeText(SEED_RAW).then(() => {
                seedVal.textContent = 'COPIED TO CLIPBOARD';
                setTimeout(() => { updateSeedDisplay(); }, 2000);
            }).catch(err => {
                console.error('Failed to copy seed: ', err);
                alert('Could not copy seed automatically.');
            });
        });

        function rand() { return rng(); }
        function randRange(min, max) { return min + (max - min) * rand(); }
        function randInt(min, max) { return Math.floor(randRange(min, max + 1)); }
        function pick(arr) { return arr[randInt(0, arr.length - 1)]; }

        function seededColor() {
            const hue = rand();
            const sat = 0.65 + 0.35 * rand();
            const light = 0.40 + 0.45 * rand();
            return new THREE.Color().setHSL(hue, sat, light);
        }

        // =====================================================================
        //  PALETTE ENGINE — the whole dimension is exactly two colours.
        //  A (deep) and B (bright). They jump to a new random pair on a seeded
        //  schedule and every material in the scene reads the same uniforms, so
        //  the change lands everywhere in the same frame.
        // =====================================================================
        const HUE_GAPS = [0.5, 0.5, 0.33, 0.42, 0.08, 0.12, 0.62, 0.25];
        function makePair(r) {
            const h1 = r();
            const gap = HUE_GAPS[Math.floor(r() * HUE_GAPS.length)];
            const h2 = (h1 + gap + (r() - 0.5) * 0.06 + 1) % 1;
            const mode = r();
            let a, b;
            if (mode < 0.25) {
                // ink + neon
                a = new THREE.Color().setHSL(h1, 0.55 + 0.45 * r(), 0.08 + 0.12 * r());
                b = new THREE.Color().setHSL(h2, 0.85 + 0.15 * r(), 0.55 + 0.25 * r());
            } else if (mode < 0.5) {
                // dusk pair
                a = new THREE.Color().setHSL(h1, 0.6 + 0.3 * r(), 0.18 + 0.17 * r());
                b = new THREE.Color().setHSL(h2, 0.5 + 0.4 * r(), 0.62 + 0.25 * r());
            } else if (mode < 0.7) {
                // near-monochrome: same hue, two values
                a = new THREE.Color().setHSL(h1, 0.5 + 0.5 * r(), 0.12 + 0.15 * r());
                b = new THREE.Color().setHSL((h1 + (r() - 0.5) * 0.05 + 1) % 1, 0.4 + 0.5 * r(), 0.7 + 0.22 * r());
            } else if (mode < 0.85) {
                // bleached / paper
                a = new THREE.Color().setHSL(h1, 0.7 + 0.3 * r(), 0.22 + 0.2 * r());
                b = new THREE.Color().setHSL(h2, 0.15 + 0.3 * r(), 0.85 + 0.12 * r());
            } else {
                // acid
                a = new THREE.Color().setHSL(h1, 0.95, 0.3 + 0.2 * r());
                b = new THREE.Color().setHSL(h2, 0.95, 0.5 + 0.2 * r());
            }
            return { a, b };
        }

        const first = makePair(rand);
        const palette = {
            a: first.a.clone(), b: first.b.clone(),          // live, what shaders read
            fromA: first.a.clone(), fromB: first.b.clone(),
            toA: first.a.clone(), toB: first.b.clone(),
            t0: 0, dur: 1, next: 2.5 + 6 * rand(),
            kick: 0,                                         // 1 right after a jump, decays
            hard: false,
            jumps: 0,
        };
        const paletteTempo = randRange(0.6, 1.6);            // how restless this seed is
        BOOT.palette('#' + palette.a.getHexString(), '#' + palette.b.getHexString());
        BOOT.stage(32, 'DUOTONE', 'PAL', '#' + palette.a.getHexString() + '  /  #' + palette.b.getHexString() + '  ·  tempo ' + paletteTempo.toFixed(2));

        function schedulePaletteJump(now) {
            const pair = makePair(runtimeRng);
            palette.fromA.copy(palette.a);
            palette.fromB.copy(palette.b);
            palette.toA.copy(pair.a);
            palette.toB.copy(pair.b);
            palette.t0 = now;
            const roll = runtimeRng();
            palette.hard = roll < ml(0.0, 0.3);                           // calm never hard-cuts, wild does 30% of the time
            palette.dur = palette.hard ? 0.0001 : (ml(1.6, 0.4) + 3.2 * runtimeRng());
            palette.next = now + (2.5 + 11 * runtimeRng()) * ml(2.0, 1.0) / paletteTempo;   // calm jumps half as often
            palette.kick = 1;
            palette.jumps++;
            if (typeof mutation !== 'undefined') mutation.v = Math.min(mutation.max, mutation.v + 0.03);   // each jump mutates it a step further
        }

        function updatePalette(now) {
            if (now >= palette.next) schedulePaletteJump(now);
            let k = Math.min(1, (now - palette.t0) / palette.dur);
            k = k * k * (3 - 2 * k);
            palette.a.copy(palette.fromA).lerp(palette.toA, k);
            palette.b.copy(palette.fromB).lerp(palette.toB, k);
            palette.kick = Math.max(0, 1 - (now - palette.t0) / 0.6);     // a 0.6 s flinch, clock-based
        }

        const SHAPE_COUNT = 41;                         // 0..39 generators, 40 = compound of the others
        const SHAPE_NAMES = ['torus knot', 'supershape', 'wobble torus', 'icosahedron', 'octahedron', 'dodecahedron', 'box', 'sphere', 'cylinder', 'cone',
            'ring', 'plane', 'lathe', 'spiral shell', 'saddle sheet', 'corkscrew', 'fluted torus', 'ribbed cylinder', 'rippled sphere', 'sinc ripple',
            'torus arc', 'spline tube', 'lathe pod', 'lissajous knot', 'harmonic blob', 'klein bottle', 'möbius band', 'berry cluster', 'fractal flake', 'gyroid sheet',
            'conch', 'superellipsoid', 'braid', 'enneper', 'dini', 'roman surface', 'voxel colony', 'clelia spiral', 'urchin', 'rose lathe', 'compound'];
        function getGeoParams() {
            const type = randInt(0, SHAPE_COUNT - 1);
            const radius = randRange(1.4, 5.2);
            const tube = randRange(0.2, 1.3);
            const radialSeg = randInt(8, 64);
            const tubularSeg = randInt(8, 64);
            const p = randInt(1, 15);
            const q = randInt(1, 15);
            const width = randRange(2.0, 6.5);
            const height = randRange(2.0, 6.5);
            const depth = randRange(2.0, 6.5);
            const detail = randInt(1, 8);
            return { type, radius, tube, radialSeg, tubularSeg, p, q, width, height, depth, detail };
        }

        function getMotionParams() {
            return {
                rotSpeedX: randRange(-1.2, 1.2),
                rotSpeedY: randRange(-1.2, 1.2),
                rotSpeedZ: randRange(-1.2, 1.2),
                orbitSpeed: randRange(0.1, 2.5),
                bobSpeed: randRange(0.1, 2.5),
                bobAmp: randRange(0.1, 1.2),
                waveSpeed: randRange(0.1, 2.0),
                waveAmp: randRange(0.05, 1.0),
                particleSpeed: randRange(0.05, 1.5),
                particleSpread: randRange(2.5, 14),
                pulseSpeed: randRange(0.2, 2.5),
                pulseAmp: randRange(0.02, 0.6),
                chaosFactor: randRange(0.1, 3.0),
                invertChance: rand(),
                brightnessOffset: randRange(-0.3, 0.5),
            };
        }

        const container = document.getElementById('canvas-container');
        const width = container.clientWidth;
        const height = container.clientHeight;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111211);
        scene.fog = new THREE.Fog(0x111211, 60, 240);

        const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 400);
        camera.position.set(0, 1.8, 11.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
            powerPreference: 'high-performance',
        });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.6;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.enablePan = false;
        controls.target.set(0, 0, 0);
        controls.maxPolarAngle = Math.PI / 2;
        controls.minPolarAngle = 0;
        controls.minDistance = 1;
        controls.maxDistance = 200;

        // ---------------------------------------------------------------------
        //  Post: render -> bloom -> DUOTONE (two colours, nothing else) -> film -> afterimage
        // ---------------------------------------------------------------------
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));

        const bloomPass = new UnrealBloomPass(new THREE.Vector2(width, height), 0.15, 0.35, 0.65);
        composer.addPass(bloomPass);

        const duotoneShader = {
            uniforms: {
                tDiffuse: { value: null },
                uColA: { value: palette.a },
                uColB: { value: palette.b },
                uExposure: { value: randRange(0.45, 0.85) },
                uContrast: { value: randRange(1.0, 1.5) },
                uSplit: { value: randRange(0.4, 0.6) },     // where A hands over to B
                uGrainT: { value: 0 },
                uGrain: { value: 0.006 },                 // dither amplitude, mood-driven
                uKick: { value: 0 },
            },
            vertexShader: `
                varying vec2 vUv;
                void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform vec3 uColA, uColB;
                uniform float uExposure, uContrast, uSplit, uGrainT, uGrain, uKick;
                varying vec2 vUv;
                float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
                void main() {
                    vec3 src = texture2D(tDiffuse, vUv).rgb * uExposure;     // linear HDR straight from the composer
                    src = (src * (2.51 * src + 0.03)) / (src * (2.43 * src + 0.59) + 0.14);   // ACES fit
                    float lum = dot(clamp(src, 0.0, 1.0), vec3(0.2126, 0.7152, 0.0722));
                    lum = pow(lum, 1.0 / 1.8);                               // to display gamma before the ramp
                    lum = clamp((lum - 0.5) * uContrast + 0.5, 0.0, 1.0);
                    lum += (hash12(vUv * 1731.0 + uGrainT) - 0.5) * uGrain; // just enough dither that the ramp never bands
                    lum = clamp(lum, 0.0, 1.0);
                    // four stops built from ONLY the two colours: A sunk to near-black, A, B, B lifted
                    vec3 k0 = uColA * 0.05;
                    vec3 k1 = uColA;
                    vec3 k2 = uColB;
                    vec3 k3 = mix(uColB, vec3(1.0), 0.35);
                    float s = uSplit;
                    vec3 col;
                    if (lum < s * 0.75) col = mix(k0, k1, smoothstep(0.0, s * 0.75, lum));
                    else if (lum < s + (1.0 - s) * 0.55) col = mix(k1, k2, smoothstep(s * 0.75, s + (1.0 - s) * 0.55, lum));
                    else col = mix(k2, k3, smoothstep(s + (1.0 - s) * 0.55, 1.0, lum));
                    // the instant a palette lands, a whole-frame flash of B
                    col = mix(col, uColB, uKick * uKick * 0.25);
                    gl_FragColor = vec4(col, 1.0);
                }
            `,
        };
        const duotonePass = new ShaderPass(duotoneShader);
        composer.addPass(duotonePass);

        const filmPass = new FilmPass(0.06, false);            // intensity is re-set every frame from the mood
        composer.addPass(filmPass);
        const filmNoise = filmPass.uniforms.nIntensity || filmPass.uniforms.intensity;   // r157 / r163+ names

        const afterimagePass = new AfterimagePass(0.86);       // damp is re-set every frame from the mood
        afterimagePass.renderToScreen = true;
        composer.addPass(afterimagePass);

        // ---------------------------------------------------------------------
        //  Lights (hue no longer matters after the duotone — only where light lands)
        // ---------------------------------------------------------------------
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.25);
        scene.add(ambientLight);

        const lightColor = seededColor();
        const lightPos = new THREE.Vector3(
            Math.sin(randRange(0, Math.PI * 2)) * randRange(7, 13),
            randRange(8, 16),
            Math.cos(randRange(0, Math.PI * 2)) * randRange(7, 13)
        );

        const keyLight = new THREE.DirectionalLight(0xffffff, randRange(0.9, 1.5));
        keyLight.position.copy(lightPos);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.camera.near = 0.8;
        keyLight.shadow.camera.far = 60.0;
        const shadowExtent = randRange(10, 18);

                    const at = (x, y, z) => (x < 0 || y < 0 || z < 0 || x >= N || y >= N || z >= N) ? 0 : live[x + N * (y + N * z)];

                        const nb = at(x-1,y,z) + at(x+1,y,z) + at(x,y-1,z) + at(x,y+1,z) + at(x,y,z-1) + at(x,y,z+1);
                        next[x + N * (y + N * z)] = at(x, y, z) ? (nb >= 1 ? 1 : 0) : (nb >= 3 ? 1 : 0);
                    }
                    const parts = [];
                    for (let z = 0; z < N && parts.length < 320; z++) for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
                        if (!next[x + N * (y + N * z)]) continue;
                        const s = cell * randRange(0.75, 1.0);
                        const box = new THREE.BoxGeometry(s, s, s, 2, 2, 2);
                        box.translate((x - (N - 1) / 2) * cell, (y - (N - 1) / 2) * cell, (z - (N - 1) / 2) * cell);
                        parts.push(nonIndexed(box));
                    }
                    if (!parts.length) parts.push(nonIndexed(new THREE.BoxGeometry(R, R, R, 4, 4, 4)));
                    g = mergeGeometries(parts);
                    break;
                }
                case 37: {
                    // CLELIA — a spiral wound over a sphere from pole to pole, as a tube
                    const c = randRange(2, 9), tubeR = geoParams.tube * randRange(0.2, 0.5), pts = [];
                    for (let i = 0; i <= 400; i++) {
                        const th = (i / 400) * Math.PI;
                        pts.push(new THREE.Vector3(R * Math.sin(th) * Math.cos(c * th), R * Math.cos(th), R * Math.sin(th) * Math.sin(c * th)));
                    }
                    g = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, false), 400, tubeR, Math.max(6, Math.floor(subSeg2 / 2)), false);
                    break;
                }
                case 38: {
                    // URCHIN — a core with spines placed by the golden angle, so they never line up
                    const spikes = randInt(30, 140), len = R * randRange(0.6, 1.6), base = R * randRange(0.04, 0.12), core = R * randRange(0.35, 0.7);
                    const parts = [nonIndexed(new THREE.SphereGeometry(core, 32, 24))];
                    const ga = Math.PI * (3 - Math.sqrt(5)), up = new THREE.Vector3(0, 1, 0), dir = new THREE.Vector3(), q = new THREE.Quaternion();
                    for (let i = 0; i < spikes; i++) {
                        const y = 1 - (i / (spikes - 1)) * 2, rr = Math.sqrt(1 - y * y), th = ga * i;
                        dir.set(Math.cos(th) * rr, y, Math.sin(th) * rr);
                        const h = len * randRange(0.5, 1.3);

                        parts.push(nonIndexed(cone));

                }
                case 39: {
                    // ROSE LATHE — a rhodonea profile r = cos(kθ) spun, with a sine ruffle on the rim
                    const k = randInt(2, 7), ruffle = randRange(0, 0.25), H = geoParams.height;
                    g = new THREE.LatheGeometry(Array.from({ length: 48 }, (_, i) => {
                        const t = i / 47, th = t * Math.PI;
                        const r = Math.abs(Math.cos(k * th)) * R * (0.6 + 0.4 * Math.sin(t * Math.PI)) + 0.05 * R + Math.sin(t * Math.PI * 9) * ruffle * R;

                }

                default: {
                    // COMPOUND — 2 to 4 other shapes, each thrown into its own orientation and fused
                    if (depth > 0) { g = new THREE.TorusKnotGeometry(R * 0.6, geoParams.tube * 0.6, 96, 20, randInt(1, 5), randInt(2, 6)); break; }
                    const n = randInt(2, 4), parts = [];
                    for (let i = 0; i < n; i++) {
                        let t = randInt(0, SHAPE_COUNT - 2);
                        if (t === 27 || t === 28 || t === 36 || t === 38) t = randInt(0, 26);   // keep the vertex budget sane
                        const sub = nonIndexed(buildShape(t, depth + 1));
                        const m = new THREE.Matrix4().compose(
                            new THREE.Vector3(randRange(-1, 1), randRange(-1, 1), randRange(-1, 1)).multiplyScalar(R * 0.35),
                            new THREE.Quaternion().setFromEuler(new THREE.Euler(randRange(0, 6.28), randRange(0, 6.28), randRange(0, 6.28))),
                            new THREE.Vector3().setScalar(randRange(0.45, 0.95)));
                        sub.applyMatrix4(m);
                        parts.push(sub);
                    }
                    g = mergeGeometries(parts);
                    break;
                }
            }
            return g;
        }

        const urlParams = new URLSearchParams(location.search);
        const forcedShape = parseInt(urlParams.get('shape'), 10);
        const shapeType = Number.isFinite(forcedShape) ? Math.abs(forcedShape) % SHAPE_COUNT : Math.abs(Math.floor(geoParams.type)) % SHAPE_COUNT;
        let mainGeo = buildShape(shapeType, 0);
        // weld: compound/merged shapes come back unindexed with flat normals, and a vertex
        // shader that pushes along the normal would tear every face apart at the seams
        mainGeo.deleteAttribute('uv');
        mainGeo = mergeVertices(mainGeo, 1e-4);

        // ---- CPU pass: a LINEAGE of mutations, each generation working on the last ----
        const posAttr = mainGeo.attributes.position;
        const vertCount = posAttr.count;
        const P = posAttr.array;
        const geoRadius = () => { let m = 0; for (let i = 0; i < P.length; i += 3) m = Math.max(m, P[i] * P[i] + P[i + 1] * P[i + 1] + P[i + 2] * P[i + 2]); return Math.sqrt(m) || 1; };
        // smooth 3-D value noise for the 'noise' mutator; the hash offset is seeded so it belongs to the dimension
        const nSeed = randRange(1, 1000);
        const hash3 = (x, y, z) => { const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7 + nSeed) * 43758.5453; return s - Math.floor(s); };
        const vnoise = (x, y, z) => {
            const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
            let fx = x - ix, fy = y - iy, fz = z - iz;
            fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
            const l = (p, q, t) => p + (q - p) * t;
            return l(l(l(hash3(ix, iy, iz), hash3(ix + 1, iy, iz), fx), l(hash3(ix, iy + 1, iz), hash3(ix + 1, iy + 1, iz), fx), fy),
                     l(l(hash3(ix, iy, iz + 1), hash3(ix + 1, iy, iz + 1), fx), l(hash3(ix, iy + 1, iz + 1), hash3(ix + 1, iy + 1, iz + 1), fx), fy), fz);

        const _p = new THREE.Vector3(), _ax = new THREE.Vector3();

        // Every mutator works in place on the vertex array; Rr is the current radius, k the strength (≈0.6–1.5)
        const MUTATORS = {
            twist(Rr, k) {
                const tK = 2.5 / Math.max(1.5, Rr) * k, tX = randRange(-tK, tK), tY = randRange(-tK, tK);
                for (let i = 0; i < P.length; i += 3) {
                    let x = P[i], y = P[i + 1], z = P[i + 2];
                    const aY = z * tY * 0.2, aX = y * tX * 0.2;
                    const nx = x * Math.cos(aY) - z * Math.sin(aY); let nz = x * Math.sin(aY) + z * Math.cos(aY); x = nx; z = nz;
                    const ny = y * Math.cos(aX) - z * Math.sin(aX); nz = y * Math.sin(aX) + z * Math.cos(aX); y = ny; z = nz;
                    P[i] = x; P[i + 1] = y; P[i + 2] = z;
                }
                return 'twist';
            },
            warp(Rr, k) {            // domain warp: the shape folds through itself
                const amp = randRange(0.1, 0.9) * k * Math.max(1, Rr * 0.3), f = randRange(0.4, 1.6) / Math.max(1, Rr * 0.3);
                for (let i = 0; i < P.length; i += 3) {
                    const x = P[i], y = P[i + 1], z = P[i + 2];
                    P[i] += Math.sin(y * f + z * 0.7) * amp; P[i + 1] += Math.sin(z * f + x * 0.7) * amp; P[i + 2] += Math.sin(x * f + y * 0.7) * amp;
                }
                return 'warp';
            },
            ripple(Rr, k) {          // spherical-harmonic ripple pushed along the radial direction
                const pX = randRange(0.5, 4.5), pY = randRange(0.5, 4.5), pZ = randRange(0.5, 4.5), fA = randRange(1, 8), fB = randRange(1, 8);
                const dAmp = randRange(0.02, 0.14) * Rr * k, order = randInt(1, 6);
                for (let i = 0; i < P.length; i += 3) {

                    const sh = Math.sin(order * Math.atan2(y, x)) * Math.cos(order * Math.acos(Math.max(-1, Math.min(1, z / dist))));
                    const disp = ((Math.sin(x * pX) * Math.cos(y * pY) * Math.sin(z * pZ) + sh * 0.4) * fA * 0.25 + Math.cos(dist * fB) * 0.5) * dAmp;

            noise(Rr, k) {           // smooth value-noise lumps, the tumorous kind of growth

            },
            swirl(Rr, k) {           // rotation about a random axis that grows with distance from it

                    _p.applyAxisAngle(ax, radial * turns * Math.PI);

            },
            bulge(Rr, k) {           // swell or pinch the waist along a random axis

                for (let i = 0; i < P.length; i += 3) {

            shear(Rr, k) {

            },
            fold(Rr, k) {            // mirror everything on one side of a random plane: a crease of forced symmetry

            },
        };
        const MUT_KEYS = Object.keys(MUTATORS);

        // Generation 0 is the classic triple (twist, maybe warp, ripple). Then 1–4 more
        // generations, each picked at random and each a little stronger than the last,
        // so the shape drifts further from its family the deeper the lineage goes.
        const lineage = [];
        lineage.push(MUTATORS.twist(geoRadius(), 1));
        if (rand() < 0.6) lineage.push(MUTATORS.warp(geoRadius(), 1));
        lineage.push(MUTATORS.ripple(geoRadius(), 1));
        const extraGens = randInt(1, 4);
        for (let gen = 0; gen < extraGens; gen++) {
            lineage.push(MUTATORS[pick(MUT_KEYS)](geoRadius(), 0.6 + 0.3 * gen));
        }
        BOOT.stage(55, SHAPE_NAMES[shapeType], 'SHAPE', String(shapeType).padStart(2, '0') + '/' + (SHAPE_COUNT - 1) + '  ·  ' + vertCount.toLocaleString() + ' verts  ·  r ' + geoParams.radius.toFixed(1));
        BOOT.stage(66, 'MUTATING', 'MUT', lineage.join(' → '));
        mainGeo.computeVertexNormals();
        mainGeo.center();
        mainGeo.computeBoundingSphere();
        const mainRadius = mainGeo.boundingSphere.radius;
        // step back so a big shape is a shape, not a wall
        camera.position.set(0, mainRadius * 0.3, Math.max(11.5, mainRadius * 2.3));
        camera.lookAt(0, 0, 0);

        // =====================================================================
        //  BERRY MATERIAL — the raspberry/blueberry skin optics, made procedural.
        //  Every surface is tiled with 3D Voronoi "drupelets": each cell is a sac
        //  of juice with its own centre, so the fragment shader can do what the
        //  original does with mesh data — Beer-Lambert absorption through the
        //  bead, light wrapping out past the terminator, seeing through a sac to
        //  what's behind, a pale seed blur, GGX specular with Karis' env BRDF,
        //  velvet sheen from hairs too fine to draw, and a dusty wax bloom.
        // =====================================================================
        const BERRY_GLSL_COMMON = `
            float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
            vec3 hash3(vec3 p) {
              p = vec3(dot(p, vec3(127.1, 311.7, 74.7)), dot(p, vec3(269.5, 183.3, 246.1)), dot(p, vec3(113.5, 271.9, 124.6)));

            }
            float noise(vec3 p) {
              vec3 i = floor(p); vec3 f = fract(p);
              f = f * f * (3.0 - 2.0 * f);
              return mix(
                mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x), mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x), mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);

              float f = 0.0, amp = 0.5;
              for (int i = 0; i < 3; i++) { f += amp * noise(p); p *= 2.03; amp *= 0.5; }
              return f;
            }
            // nearest two drupelet centres around p (cell units)
            void voronoi(vec3 p, out float d1, out float d2, out vec3 c1) {
              vec3 i = floor(p); vec3 f = fract(p);
              d1 = 8.0; d2 = 8.0; c1 = vec3(0.0);
              for (int x = -1; x <= 1; x++) for (int y = -1; y <= 1; y++) for (int z = -1; z <= 1; z++) {
                vec3 g = vec3(float(x), float(y), float(z));
                vec3 o = 0.15 + 0.7 * hash3(i + g);

                float d = dot(r, r);

            }
        `;

        const BERRY_VERT = `
            uniform float uTime, uChaos, uNoiseScale, uDispStrength, uMutate;
            uniform float uCellScale, uDomeR, uDomeAmp;
            uniform vec3 uSeedOff;
            varying vec3 vModelPos, vNormalModel, vCenter;
            varying vec4 vMask;      // x dome height, y crease openness, z per-sac random, w d1
            varying float vDisplacement;
            ${BERRY_GLSL_COMMON}
            void main() {
              vec3 pos = position;
              float n = fbm(pos * uNoiseScale + uTime * 0.15);
              float wave = sin(pos.x * 2.5 + uTime * 0.4) * 0.12 + cos(pos.y * 2.5 + uTime * 0.3) * 0.12;
              float chaosWave = sin(pos.x * uChaos + uTime * 0.4) * 0.15 + cos(pos.z * uChaos + uTime * 0.3) * 0.15;
              // the longer the dimension runs, the more uMutate grows: the base displacement
              // deepens and a finer second layer of growth surfaces that wasn't there at the start
              float n2 = fbm(pos * (uNoiseScale * 2.6 + uMutate * 1.5) - uTime * 0.07 + 19.0);
              float d = (n * 1.2 + wave + chaosWave) * uDispStrength * (1.0 + uMutate * 1.2) + (n2 - 0.45) * uMutate * uDispStrength * 2.5;

              vec3 q = pos * uCellScale * (1.0 + uMutate * 0.4) + uSeedOff;     // drupelets divide finer as it mutates
              float d1, d2; vec3 c;
              voronoi(q, d1, d2, c);
              float h = sqrt(max(uDomeR * uDomeR - d1 * d1, 0.0)) / uDomeR;     // spherical cap profile
              float crease = smoothstep(0.0, 0.35, d2 - d1);
              float dome = h * (0.35 + 0.65 * crease);
              vec3 rnd = hash3(c);
              float sacSize = 0.75 + 0.5 * rnd.x;                                  // no two sacs the same size

              pos += normal * (d + dome * uDomeAmp * sacSize);
              vDisplacement = d;
              vMask = vec4(h, crease, rnd.x, d1);
              vModelPos = pos;
              vNormalModel = normal;

            }
        `;

        const BERRY_FRAG = `
            uniform float uTime;
            uniform vec3 uAlbedo, uAlbedo2;        // skin colour at the two ends of the chaos displacement
            uniform vec3 uTransColor;              // colour of light after uTransDepth units of flesh
            uniform float uTransDepth;
            uniform vec3 uBackdrop;                // what you see through a sac
            uniform vec3 uCamM;                    // camera, model space
            uniform vec3 uLightDir[3];             // towards the light, model space
            uniform vec3 uLightCol[3];
            uniform vec3 uAmbient;
            uniform float uBead, uSeeThrough, uSeedAmt, uSSS;
            uniform float uRoughness, uF0, uSpecular;
            uniform float uSheen; uniform vec3 uSheenColor;
            uniform float uPoreScale, uPoreStrength;
            uniform float uBloom, uBloomScale;     // waxy blueberry bloom
            uniform float uCellScale, uDomeR;
            uniform float uPulse;
            varying vec3 vModelPos, vNormalModel, vCenter;
            varying vec4 vMask;
            varying float vDisplacement;
            ${BERRY_GLSL_COMMON}
            #ifndef saturate
            #define saturate( a ) clamp( a, 0.0, 1.0 )
            #endif
            const float PI = 3.141593;

            // Karis' analytic fit of the split-sum environment BRDF
            vec2 envBRDF(float roughness, float NoV) {
              const vec4 c0 = vec4(-1.0, -0.0275, -0.572, 0.022);
              const vec4 c1 = vec4(1.0, 0.0425, 1.04, -0.04);
