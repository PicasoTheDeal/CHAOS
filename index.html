<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAOS</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg: #0b0b0b;
            --border: #2a2a2a;
            --text: #f0f0f0;
            --border-width: 1px;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        * {
            border: var(--border-width) solid var(--border);
        }
        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bg);
            border: var(--border-width) solid var(--border);
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            border: var(--border-width) solid var(--border);
            background: transparent;
        }
        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            border: none;
            background: transparent;
        }
        #seed-display {
            position: fixed;
            bottom: 1.2em;
            right: 1.6em;
            z-index: 99;
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.5);
            padding: 0.3em 0.7em;
            border: var(--border-width) solid rgba(255, 255, 255, 0.06);
            font-family: 'Courier New', monospace;
            letter-spacing: 0.04em;
            pointer-events: auto;
            user-select: all;
            cursor: pointer;
            backdrop-filter: blur(2px);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        #seed-display:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.25);
        }

        #visitor-count {
            position: fixed;
            bottom: 1.2em;
            left: 1.6em;
            z-index: 99;
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.5);
            padding: 0.3em 0.7em;
            border: var(--border-width) solid rgba(255, 255, 255, 0.06);
            font-family: 'Courier New', monospace;
            letter-spacing: 0.04em;
            pointer-events: none;
            user-select: none;
            backdrop-filter: blur(2px);
        }
        ::-webkit-scrollbar {
            display: none;
        }
        @media (max-width: 600px) {
            #seed-display,
            #visitor-count {
                font-size: 0.4rem;
                padding: 0.2em 0.5em;
                bottom: 0.8em;
            }
            #visitor-count {
                left: 0.8em;
            }
            #seed-display {
                right: 0.8em;
            }
        }

        #plymouth {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #0b0b0b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            transition: opacity 1.2s ease;
            opacity: 1;
            pointer-events: none;
        }
        #plymouth.hide {
            opacity: 0;
        }
        #plymouth-logo {
            font-size: 2.5rem;
            font-weight: 700;
            color: #e6edf3;
            letter-spacing: 0.15em;
            margin-bottom: 30px;
            opacity: 0;
            animation: logoFade 0.8s ease forwards 0.3s;
        }
        #plymouth-logo span {
            color: #5b7a9e;
            padding: 5px;
        }
        @keyframes logoFade {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        #plymouth-lines {
            font-size: 0.7rem;
            color: #8b949e;
            line-height: 1.8;
            text-align: left;
            max-width: 520px;
            width: 90%;
            opacity: 0;
            animation: linesFade 0.6s ease forwards 0.6s;
        }
        @keyframes linesFade {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .boot-line {
            opacity: 0;
            animation: typeLine 0.4s ease forwards;
        }
        .boot-line.success {
            color: #3fb950;
        }
        .boot-line.accent {
            color: #5b7a9e;
        }
        .boot-line.dim {
            color: #4a5568;
        }
        .boot-line .cursor {
            display: inline-block;
            width: 6px;
            height: 10px;
            background: #5b7a9e;
            vertical-align: middle;
            animation: blink 0.8s step-end infinite;
        }
        @keyframes typeLine {
            0% { opacity: 0; transform: translateX(-6px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        #plymouth-progress {
            margin-top: 25px;
            width: 240px;
            height: 2px;
            background: #1c2333;
            border-radius: 2px;
            overflow: hidden;
            opacity: 0;
            animation: linesFade 0.6s ease forwards 1.2s;
        }
        #plymouth-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3d5068, #5b7a9e, #8b949e);
            border-radius: 2px;
            transition: width 0.4s ease;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="canvas-container"></div>
        <div id="seed-display">seed: —</div>
        <div id="visitor-count">visitors: —</div>
    </div>

    <div id="plymouth">
        <div id="plymouth-logo">CHAOS <span>v ∞</span></div>
        <div id="plymouth-lines">
            <div class="boot-line" style="animation-delay:0.9s;">[ INITIALIZING ENTROPY POOL ]</div>
            <div class="boot-line" style="animation-delay:1.3s;">[ GENERATING 256-DIGIT SEED ]</div>
            <div class="boot-line" style="animation-delay:1.7s;">[ EXTRACTING FROM Pi ]</div>
            <div class="boot-line" style="animation-delay:2.1s;">[ SHA-512 HASHING ]</div>
            <div class="boot-line success" style="animation-delay:2.5s;">[ SEED GENERATED ]</div>
            <div class="boot-line accent" style="animation-delay:2.9s;">[ VISUAL ENGINE STARTING ]</div>
            <div class="boot-line dim" style="animation-delay:3.3s;">[ SYSTEM READY ] <span class="cursor"></span></div>
        </div>
        <div id="plymouth-progress">
            <div id="plymouth-progress-bar"></div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from "three";
        import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
        import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
        import { AfterimagePass } from "three/addons/postprocessing/AfterimagePass.js";
        import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
        import { FilmPass } from "three/addons/postprocessing/FilmPass.js";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";
        import { ParametricGeometry } from "three/addons/geometries/ParametricGeometry.js";

        const plymouth = document.getElementById('plymouth');
        const progressBar = document.getElementById('plymouth-progress-bar');
        const bootSteps = [
            { progress: 10, delay: 300 },
            { progress: 30, delay: 600 },
            { progress: 50, delay: 800 },
            { progress: 70, delay: 1100 },
            { progress: 85, delay: 1400 },
            { progress: 95, delay: 1700 },
            { progress: 100, delay: 2100 },
        ];

        bootSteps.forEach((step) => {
            setTimeout(() => {
                progressBar.style.width = step.progress + '%';
                if (step.progress === 100) {
                    setTimeout(() => {
                        plymouth.classList.add('hide');
                        setTimeout(() => {
                            plymouth.style.display = 'none';
                        }, 1200);
                    }, 300);
                }
            }, step.delay + 500);
        });

        let visitorCount = parseInt(localStorage.getItem('chaos_visitors') || '0');
        visitorCount++;
        localStorage.setItem('chaos_visitors', String(visitorCount));
        document.getElementById('visitor-count').textContent = 'visitors: ' + visitorCount;

        const BASE_SEED = '00836493336544514685802702179290110422953473874561002201490748290772036355306061547857002492525402183261625451942595336100236221';
        const SEED_RAW = BASE_SEED + String(visitorCount).padStart(10, '0');

        function splitmix64(a) {
            return function() {
                a = (a + 0x9e3779b97f4a7c15n) & 0xffffffffffffffffn;
                let z = a;
                z = ((z ^ (z >> 30n)) * 0xbf58476d1ce4e5b9n) & 0xffffffffffffffffn;
                z = ((z ^ (z >> 27n)) * 0x94d049bb133111ebn) & 0xffffffffffffffffn;
                return Number((z ^ (z >> 31n)) & 0xffffffffffffffffn) / 18446744073709551616;
            };
        }

        function seedTo64(s) {
            let h1 = 0n, h2 = 0n;
            const str = String(s);
            for (let i = 0; i < str.length; i++) {
                const c = BigInt(str.charCodeAt(i));
                if (i < str.length / 2) {
                    h1 = ((h1 << 8n) + c) & 0xffffffffffffffffn;
                } else {
                    h2 = ((h2 << 8n) + c) & 0xffffffffffffffffn;
                }
            }
            return (h1 ^ (h2 << 32n)) & 0xffffffffffffffffn;
        }

        const seed64 = seedTo64(SEED_RAW);
        const rng = splitmix64(seed64);

        const seedDisplay = document.getElementById('seed-display');

        function updateSeedDisplay() {
            if (window.innerWidth <= 600) {
                seedDisplay.textContent = 'seed: ' + SEED_RAW.slice(0, 14) + '...' + SEED_RAW.slice(-6);
            } else {
                seedDisplay.textContent = 'seed: ' + SEED_RAW;
            }
        }

        updateSeedDisplay();

        seedDisplay.addEventListener('click', () => {
            navigator.clipboard.writeText(SEED_RAW).then(() => {
                seedDisplay.textContent = 'Copied to clipboard!';

                setTimeout(() => {
                    updateSeedDisplay();
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy seed: ', err);
                alert('Could not copy seed automatically.');
            });
        });

        function rand() { return rng(); }
        function randRange(min, max) { return min + (max - min) * rand(); }
        function randInt(min, max) { return Math.floor(randRange(min, max + 1)); }

        function seededColor() {
            const hue = rand();
            const sat = 0.65 + 0.35 * rand();
            const light = 0.40 + 0.45 * rand();
            return new THREE.Color().setHSL(hue, sat, light);
        }

        function getBgColors() {
            const h1 = rand();
            const h2 = (h1 + 0.4 + 0.4 * rand()) % 1.0;
            const s1 = 0.7 + 0.3 * rand();
            const s2 = 0.7 + 0.3 * rand();
            const l1 = 0.02 + 0.06 * rand();
            const l2 = 0.02 + 0.06 * rand();
            return {
                top: new THREE.Color().setHSL(h1, s1, l1),
                bottom: new THREE.Color().setHSL(h2, s2, l2),
            };
        }

        function getGeoParams() {
            const type = randInt(0, 12);
            const radius = randRange(0.8, 3.2);
            const tube = randRange(0.15, 0.9);
            const radialSeg = randInt(8, 64);
            const tubularSeg = randInt(8, 64);
            const p = randInt(1, 15);
            const q = randInt(1, 15);
            const width = randRange(1.2, 4.0);
            const height = randRange(1.2, 4.0);
            const depth = randRange(1.2, 4.0);
            const detail = randInt(1, 8);
            return { type, radius, tube, radialSeg, tubularSeg, p, q, width, height, depth, detail };
        }

        function getMotionParams() {
            return {
                rotSpeedX: randRange(-1.2, 1.2),
                rotSpeedY: randRange(-1.2, 1.2),
                rotSpeedZ: randRange(-1.2, 1.2),
                orbitSpeed: randRange(0.1, 2.5),
                bobSpeed: randRange(0.1, 2.5),
                bobAmp: randRange(0.1, 1.2),
                waveSpeed: randRange(0.1, 2.0),
                waveAmp: randRange(0.05, 1.0),
                particleSpeed: randRange(0.05, 1.5),
                particleSpread: randRange(1.5, 10),
                pulseSpeed: randRange(0.2, 2.5),
                pulseAmp: randRange(0.02, 0.6),
                chaosFactor: randRange(0.1, 3.0),
                invertChance: rand(),
                brightnessOffset: randRange(-0.3, 0.5),
            };
        }

        const container = document.getElementById('canvas-container');
        const width = container.clientWidth;
        const height = container.clientHeight;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0b);
        scene.fog = new THREE.Fog(0x0b0b0b, 50, 200);

        const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 200);
        camera.position.set(0, 1.2, 7);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
            powerPreference: 'high-performance',
        });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.5;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.enablePan = false;
        controls.target.set(0, 0, 0);
        controls.maxPolarAngle = Math.PI / 2;
        controls.minPolarAngle = 0;
        controls.minDistance = 1;
        controls.maxDistance = 200;

        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(new THREE.Vector2(width, height), 0.15, 0.3, 0.1);
        composer.addPass(bloomPass);

        const filmPass = new FilmPass(0.35, 0.025, 648, false);
        composer.addPass(filmPass);

        const afterimagePass = new AfterimagePass(0.96);
        afterimagePass.renderToScreen = true;
        composer.addPass(afterimagePass);

        const ambientLight = new THREE.AmbientLight(0x0a0414, 0.25);
        scene.add(ambientLight);

        const lightColor = seededColor();
        const lightPos = new THREE.Vector3(
            Math.sin(randRange(0, Math.PI * 2)) * randRange(5, 9),
            randRange(7, 14),
            Math.cos(randRange(0, Math.PI * 2)) * randRange(5, 9)
        );

        const keyLight = new THREE.DirectionalLight(lightColor, randRange(0.9, 1.5));
        keyLight.position.copy(lightPos);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.camera.near = 0.8;
        keyLight.shadow.camera.far = 40.0;

        const shadowExtent = randRange(8, 14);
        keyLight.shadow.camera.left = -shadowExtent;
        keyLight.shadow.camera.right = shadowExtent;
        keyLight.shadow.camera.top = shadowExtent;
        keyLight.shadow.camera.bottom = -shadowExtent;
        keyLight.shadow.bias = -0.0002;
        keyLight.shadow.normalBias = 0.022;
        keyLight.shadow.radius = randRange(2.0, 5.0);
        scene.add(keyLight);

        const lightColor2 = seededColor();
        const fillLight = new THREE.DirectionalLight(lightColor2, randRange(0.2, 0.45));
        fillLight.position.set(
            -lightPos.x * randRange(0.7, 1.3),
            randRange(-3, 5),
            -lightPos.z * randRange(0.7, 1.3)
        );
        scene.add(fillLight);

        const lightColor3 = seededColor();
        const rimLight = new THREE.DirectionalLight(lightColor3, randRange(0.4, 0.8));
        rimLight.position.set(
            randRange(-4, 4),
            randRange(2, 6),
            -randRange(8, 14)
        );
        scene.add(rimLight);

        const bgColors = getBgColors();
        const bgGeo = new THREE.SphereGeometry(80, 64, 64);
        const bgMat = new THREE.ShaderMaterial({
            side: THREE.BackSide,
            uniforms: {
                uTime: { value: 0 },
                uSeed: { value: Number(seed64 & 0xffffff2n) },
                uColorA: { value: bgColors.top },
                uColorB: { value: bgColors.bottom },
            },
            vertexShader: `
            varying vec3 vPos;
            void main() {
              vPos = position;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
            fragmentShader: `
            uniform vec3 uColorA;
            uniform vec3 uColorB;
            uniform float uTime;
            uniform float uSeed;
            varying vec3 vPos;
        
            mat2 rot(float a) {
              float c = cos(a), s = sin(a);
              return mat2(c, -s, s, c);
            }
        
            float hyperspace(vec2 p, float t) {
              float accum = 0.0;
              float amp = 0.5;
              vec2 shift = vec2(100.0);
              for (int i = 0; i < 5; i++) {
                p = rot(1.2 + uSeed * 0.0001) * p * 1.4 + shift;
                p += sin(p.yx * 2.0 + t * 0.3) * 0.6;
                accum += sin(p.x + p.y) * amp;
                amp *= 0.5;
              }
              return accum;
            }
        
            vec3 hsv2rgb(vec3 c) {
              vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
              vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
              return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
            }
        
            void main() {
              vec3 dir = normalize(vPos);
              vec2 uv = dir.xy / (1.0 + abs(dir.z));
              uv *= 2.5;
        
              float t = uTime * 0.15;
        
              vec2 p = uv + vec2(sin(t * 0.2), cos(t * 0.3)) * 0.5;
              float warp1 = hyperspace(p, t);
              float warp2 = hyperspace(p * 1.5 - warp1, -t * 0.8);
        
              float pattern = sin(warp1 * 4.0 + warp2 * 3.0 + t) * 0.5 + 0.5;
              float structure = cos(warp2 * 6.0 - warp1 * 2.0 - t * 0.5) * 0.5 + 0.5;
        
              float hue = fract(pattern * 0.3 + structure * 0.2 + t * 0.05 + uSeed * 0.00001);
              float sat = 0.85 + 0.15 * sin(warp1 * 5.0);
              float light = 0.12 + 0.18 * structure;
        
              vec3 psychedelic = hsv2rgb(vec3(hue, sat, light));
        
              float mixFactor = smoothstep(0.1, 0.9, pattern);
              vec3 baseCol = mix(uColorA, uColorB, mixFactor);
        
              vec3 finalCol = mix(baseCol, psychedelic, 0.55 + 0.25 * cos(t * 0.4));
        
              float grid = abs(sin(uv.x * 10.0 + warp1 * 3.0) * cos(uv.y * 20.0 + warp2 * 3.0));
              grid = pow(grid, 4.0) * 0.2;
              finalCol += vec3(0.6, 0.9, 1.0) * grid * (0.5 + 0.5 * sin(t));
        
              float vignette = 1.0 - 0.4 * length(dir.xy);
              finalCol *= vignette;
        
              gl_FragColor = vec4(finalCol, 1.0);
            }
          `,
        });
        const bgMesh = new THREE.Mesh(bgGeo, bgMat);
        bgMesh.receiveShadow = false;
        scene.add(bgMesh);

        const geoParams = getGeoParams();
        let mainGeo;
        const subSeg = Math.floor(randRange(24, 96));
        const subSeg2 = Math.floor(randRange(12, 48));
        const shapeType = Math.abs(Math.floor(geoParams.type)) % 24;

        const superformula = (phi, a, b, m, n1, n2, n3) => {
            let t1 = Math.abs(Math.cos(m * phi / 4) / a);
            t1 = Math.pow(t1, n2);
            let t2 = Math.abs(Math.sin(m * phi / 4) / b);
            t2 = Math.pow(t2, n3);
            let t3 = t1 + t2;
            if (t3 === 0) return 0;
            return Math.pow(t3, -1 / n1);
        };

        switch (shapeType) {
            case 0:
                mainGeo = new THREE.TorusKnotGeometry(geoParams.radius, geoParams.tube, subSeg * 2, subSeg2, Math.floor(randRange(1, 8)), Math.floor(randRange(2, 11)));
                break;
            case 1:
                mainGeo = new THREE.ParametricGeometry((u, v, target) => {
                    const theta = u * Math.PI * 2;
                    const phi = (v - 0.5) * Math.PI;
                    const r1 = superformula(theta, randRange(0.5, 1.5), randRange(0.5, 1.5), randRange(2, 9), randRange(0.5, 2.0), randRange(0.5, 2.0), randRange(0.5, 2.0));
                    const r2 = superformula(phi, randRange(0.5, 1.5), randRange(0.5, 1.5), randRange(1, 7), randRange(0.5, 2.0), randRange(0.5, 2.0), randRange(0.5, 2.0));
                    const x = geoParams.radius * r1 * Math.cos(theta) * r2 * Math.cos(phi);
                    const y = geoParams.radius * r1 * Math.sin(theta) * r2 * Math.cos(phi);
                    const z = geoParams.radius * r2 * Math.sin(phi);
                    target.set(x, y, z);
                }, subSeg, subSeg2);
                break;
            case 2:
                mainGeo = new THREE.ParametricGeometry((u, v, target) => {
                    const u1 = u * Math.PI * 2;
                    const v1 = v * Math.PI * 2;
                    const a = geoParams.radius;
                    const n = randRange(1.0, 5.0);
                    const x = a * Math.cos(u1) * (1 + Math.cos(v1) / n);
                    const y = a * Math.sin(u1) * (1 + Math.cos(v1) / n);
                    const z = a * Math.sin(v1) / n + Math.sin(u1 * 3.0) * randRange(0.1, 0.5);
                    target.set(x, y, z);
                }, subSeg, subSeg2);
                break;
            case 3:
                mainGeo = new THREE.IcosahedronGeometry(geoParams.radius, Math.floor(randRange(0, 4)));
                break;
            case 4:
                mainGeo = new THREE.OctahedronGeometry(geoParams.radius, Math.floor(randRange(0, 4)));
                break;
            case 5:
                mainGeo = new THREE.DodecahedronGeometry(geoParams.radius, Math.floor(randRange(0, 3)));
                break;
            case 6:
                mainGeo = new THREE.BoxGeometry(geoParams.width, geoParams.height, geoParams.depth, subSeg2, subSeg2, subSeg2);
                break;
            case 7:
                mainGeo = new THREE.SphereGeometry(geoParams.radius, subSeg, subSeg2);
                break;
            case 8:
                mainGeo = new THREE.CylinderGeometry(geoParams.radius * randRange(0.1, 1.5), geoParams.radius * randRange(0.1, 1.5), geoParams.height, subSeg, subSeg2);
                break;
            case 9:
                mainGeo = new THREE.ConeGeometry(geoParams.radius, geoParams.height, subSeg, subSeg2);
                break;
            case 10:
                mainGeo = new THREE.RingGeometry(geoParams.radius * randRange(0.05, 0.5), geoParams.radius * randRange(1.0, 2.0), subSeg);
                break;
            case 11:
                mainGeo = new THREE.PlaneGeometry(geoParams.width, geoParams.height, subSeg, subSeg);
                break;
            case 12:
                mainGeo = new THREE.LatheGeometry(
                    Array.from({ length: 24 }, (_, i) => {
                        const t = i / 23;
                        return new THREE.Vector2(
                            Math.sin(t * Math.PI * randRange(1, 6)) * randRange(0.2, 1.2) + randRange(0.1, 0.5),
                            (t - 0.5) * geoParams.height * randRange(0.8, 1.5)
                        );
                    }),
                    subSeg
                );
                break;
            case 13:
                mainGeo = new THREE.ParametricGeometry((u, v, target) => {
                    const u_ = u * Math.PI * randRange(1.0, 4.0);
                    const v_ = (v - 0.5) * Math.PI * 2.0;
                    const r = geoParams.radius * (1.0 + 0.3 * Math.sin(u_ * 3.0 + v_ * 2.0));
                    const x = r * Math.cos(u_) * Math.cos(v_);
                    const y = r * Math.sin(u_) * Math.cos(v_);
                    const z = r * Math.sin(v_) + Math.cos(u_ * v_) * 0.5;
                    target.set(x, y, z);
                }, subSeg, subSeg2);
                break;
            case 14:
                mainGeo = new THREE.ParametricGeometry((u, v, target) => {
                    const u_ = u * 4.0 - 2.0;
                    const v_ = v * 4.0 - 2.0;
                    const x = u_;
                    const y = v_;
                    const z = Math.sin(u_ * u_ - v_ * v_) * 0.8 * randRange(0.5, 2.0);
                    target.set(x, y, z);
                }, subSeg, subSeg);
                break;
            case 15:
                mainGeo = new THREE.ParametricGeometry((u, v, target) => {
                    const phi = u * Math.PI * 2.0;
                    const theta = v * Math.PI;
                    const c = randRange(0.5, 2.0);
                    const x = c * (1.0 - phi / (2.0 * Math.PI)) * Math.cos(2.0 * phi) * (1.0 + Math.cos(theta)) + c * Math.cos(phi);
                    const y = c * (1.0 - phi / (2.0 * Math.PI)) * Math.sin(2.0 * phi) * (1.0 + Math.cos(theta)) + c * Math.sin(phi);
                    const z = c * (1.0 - phi / (2.0 * Math.PI)) * Math.sin(theta);
                    target.set(x, y, z);
                }, subSeg, subSeg2);
                break;
            case 16:
                mainGeo = new THREE.ParametricGeometry((u, v, target) => {
                    const u_ = u * Math.PI * 2.0;
                    const v_ = v * Math.PI;
                    const r = geoParams.radius;
                    const x = r * (2.0 + Math.cos(v_)) * Math.cos(u_);
                    const y = r * (2.0 + Math.cos(v_)) * Math.sin(u_);
                    const z = r * (Math.sin(v_) + Math.cos(v_ * 4.0));
                    target.set(x, y, z);
                }, subSeg, subSeg2);
                break;
            case 17:
                mainGeo = new THREE.ParametricGeometry((u, v, target) => {
                    const u_ = u * Math.PI * 2.0;
                    const v_ = v * 2.0 - 1.0;
                    const r = geoParams.radius;
                    const x = r * Math.sqrt(1.0 - v_ * v_) * Math.cos(u_);
                    const y = r * Math.sqrt(1.0 - v_ * v_) * Math.sin(u_);
                    const z = r * v_ + Math.sin(u_ * 6.0) * 0.2;
                    target.set(x, y, z);
                }, subSeg, subSeg2);
                break;
            case 18:
                mainGeo = new THREE.ParametricGeometry((u, v, target) => {
                    const u_ = u * Math.PI * 2.0;
                    const v_ = v * Math.PI * 2.0;
                    const x = Math.sin(u_) * Math.cos(v_) * geoParams.radius;
                    const y = Math.sin(u_) * Math.sin(v_) * geoParams.radius;
                    const z = Math.cos(u_) * geoParams.radius + Math.sin(u_ * 3.0 + v_ * 3.0) * 0.4;
                    target.set(x, y, z);
                }, subSeg, subSeg2);
                break;
            case 19:
                mainGeo = new THREE.ParametricGeometry((u, v, target) => {
                    const u_ = u * 6.0 - 3.0;
                    const v_ = v * 6.0 - 3.0;
                    const r = Math.sqrt(u_ * u_ + v_ * v_) + 0.001;
                    const z = Math.sin(r * randRange(2.0, 8.0)) / r * 0.8;
                    target.set(u_, z, v_);
                }, subSeg, subSeg);
                break;
            case 20:
                mainGeo = new THREE.TorusGeometry(geoParams.radius * randRange(0.5, 1.5), geoParams.tube * randRange(0.2, 2.0), subSeg2, subSeg, Math.PI * randRange(0.5, 2.0));
                break;
            case 21:
                mainGeo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3([
                    new THREE.Vector3(-randRange(1, 3), randRange(-1, 1), -randRange(1, 3)),
                    new THREE.Vector3(randRange(-1, 1), randRange(1, 3), randRange(-1, 1)),
                    new THREE.Vector3(randRange(1, 3), -randRange(-1, 1), randRange(1, 3)),
                    new THREE.Vector3(-randRange(1, 3), -randRange(1, 3), randRange(-1, 1))
                ]), subSeg, geoParams.tube * randRange(0.5, 2.0), subSeg2, true);
                break;
            case 22:
                mainGeo = new THREE.LatheGeometry(
                    Array.from({ length: 30 }, (_, i) => {
                        const phi = (i / 29) * Math.PI;
                        return new THREE.Vector2(
                            Math.sin(phi) * geoParams.radius + Math.cos(phi * 4.0) * 0.15,
                            Math.cos(phi) * geoParams.height
                        );
                    }),
                    subSeg
                );
                break;
            case 23:
            default:
                mainGeo = new THREE.TorusKnotGeometry(1.6, 0.4, 64, 16, Math.floor(randRange(1, 5)), Math.floor(randRange(2, 6)));
                break;
        }

        const posAttr = mainGeo.attributes.position;
        const vertCount = posAttr.count;
        const origPos = posAttr.array.slice();

        const tX = randRange(-2.5, 2.5);
        const tY = randRange(-2.5, 2.5);
        const tZ = randRange(-2.5, 2.5);
        const pX = randRange(0.5, 4.5);
        const pY = randRange(0.5, 4.5);
        const pZ = randRange(0.5, 4.5);
        const fA = randRange(1.0, 8.0);
        const fB = randRange(1.0, 8.0);
        const dAmp = randRange(0.05, 0.5);
        const harmonicOrder = Math.floor(randRange(1, 6));

        for (let i = 0; i < vertCount; i++) {
            const i3 = i * 3;
            let x = origPos[i3];
            let y = origPos[i3 + 1];
            let z = origPos[i3 + 2];
        
            const angleX = y * tX * 0.2;
            const angleY = z * tY * 0.2;
            const angleZ = x * tZ * 0.2;
        
            let nx = x * Math.cos(angleY) - z * Math.sin(angleY);
            let nz = x * Math.sin(angleY) + z * Math.cos(angleY);
            x = nx;
            z = nz;
        
            let ny = y * Math.cos(angleX) - z * Math.sin(angleX);
            nz = y * Math.sin(angleX) + z * Math.cos(angleX);
            y = ny;
            z = nz;
        
            const dist = Math.sqrt(x * x + y * y + z * z) || 1;
            const sphericalHarmonic = Math.sin(harmonicOrder * Math.atan2(y, x)) * Math.cos(harmonicOrder * Math.acos(z / dist));
            const complexMod = Math.sin(x * pX) * Math.cos(y * pY) * Math.sin(z * pZ) + (sphericalHarmonic * 0.4);
            const disp = (complexMod * fA + Math.cos(dist * fB) * 0.5) * dAmp;
        
            posAttr.array[i3] = x + (x / dist) * disp * randRange(0.8, 1.2);
            posAttr.array[i3 + 1] = y + (y / dist) * disp * randRange(0.8, 1.2);
            posAttr.array[i3 + 2] = z + (z / dist) * disp * randRange(0.8, 1.2);
        }

        mainGeo.computeVertexNormals();
        mainGeo.center();

        const h1 = rand();
        const h2 = (h1 + randRange(0.25, 0.75)) % 1.0;
        const h3 = (h2 + randRange(0.25, 0.75)) % 1.0;

        const s1 = randRange(0.65, 1.0),
            s2 = randRange(0.65, 1.0),
            s3 = randRange(0.65, 1.0);

        const l1 = randRange(0.25, 0.65),
            l2 = randRange(0.25, 0.65),
            l3 = randRange(0.25, 0.65);

        const colorA = new THREE.Color().setHSL(h1, s1, l1);
        const colorB = new THREE.Color().setHSL(h2, s2, l2);
        const colorC = new THREE.Color().setHSL(h3, s3, l3);

        const specHue = (h1 + randRange(0.05, 0.3)) % 1.0;
        const specCol = new THREE.Color().setHSL(specHue, 0.9, 0.6);

        const motion = getMotionParams();
        const shouldInvert = rand() > 0.9;
        const brightnessOffset = Math.min(0, Math.max(-0.2, motion.brightnessOffset));

        const noiseScale = randRange(0.8, 3.2);
        const dispStrength = randRange(0.12, 0.35);

        const mainMat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uColorA: { value: colorA },
                uColorB: { value: colorB },
                uColorC: { value: colorC },
                uPulseSpeed: { value: motion.pulseSpeed },
                uPulseAmp: { value: motion.pulseAmp * 0.05 },
                uChaos: { value: motion.chaosFactor },
                uInvert: { value: shouldInvert ? 1 : 0 },
                uBrightness: { value: 1 + brightnessOffset },
                uMetalness: { value: randRange(0.15, 0.45) },
                uGlossiness: { value: randRange(0.35, 0.75) },
                uSpecColor: { value: specCol },
                uLightPos: { value: lightPos.clone() },
                uLightColor: { value: lightColor.clone() },
                uShadowMap: { value: keyLight.shadow.map },
                uShadowMatrix: { value: keyLight.shadow.matrix },
            },
            vertexShader: `
                uniform float uTime;
                uniform float uChaos;
                uniform mat4 uShadowMatrix;
        
                varying vec3 vWorldNormal;
                varying vec3 vWorldPos;
                varying float vDisplacement;
                varying vec4 vShadowCoord;
        
                float hash(vec3 p) {
                  p = fract(p * 0.3183099 + 0.1);
                  p *= 17.0;
                  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
                }

                float noise(vec3 p) {
                  vec3 i = floor(p);
                  vec3 f = fract(p);
                  f = f * f * (3.0 - 2.0 * f);
                  return mix(
                    mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x),
                        mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
                    mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x),
                        mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
                }
        
                float fbm(vec3 p) {
                    float f = 0.0;
                    float amp = 0.5;
                    for (int i = 0; i < 3; i++) {
                        f += amp * noise(p);
                        p *= 2.03;
                        amp *= 0.5;
                    }
                    return f;
                }
        
                void main() {
                  vec3 pos = position;
                  float n = fbm(pos * ${noiseScale.toFixed(2)} + uTime * 0.15);
                  float wave = sin(pos.x * 2.5 + uTime * 0.4) * 0.12 +
                               cos(pos.y * 2.5 + uTime * 0.3) * 0.12;
                  float chaosWave = sin(pos.x * uChaos + uTime * 0.4) * 0.15 +
                                    cos(pos.z * uChaos + uTime * 0.3) * 0.15;

                  float d = (n * 1.2 + wave + chaosWave) * ${dispStrength.toFixed(2)};
                  pos += normal * d;
                  vDisplacement = d;
        
                  vec4 worldPos = modelMatrix * vec4(pos, 1.0);
                  vWorldPos = worldPos.xyz;
                  vWorldNormal = normalize(mat3(modelMatrix) * normal);
        
                  vShadowCoord = uShadowMatrix * worldPos;
                  gl_Position = projectionMatrix * viewMatrix * worldPos;
                }
            `,
            fragmentShader: `
                uniform vec3 uColorA;
                uniform vec3 uColorB;
                uniform vec3 uColorC;
                uniform float uTime;
                uniform float uPulseSpeed;
                uniform float uPulseAmp;
                uniform float uChaos;
                uniform float uInvert;
                uniform float uBrightness;
                uniform float uMetalness;
                uniform float uGlossiness;
                uniform vec3 uSpecColor;
                uniform vec3 uLightPos;
                uniform vec3 uLightColor;
                uniform sampler2D uShadowMap;
                uniform mat4 uShadowMatrix;
        
                varying vec3 vWorldNormal;
                varying vec3 vWorldPos;
                varying float vDisplacement;
                varying vec4 vShadowCoord;
        
                float sampleShadow(vec4 shadowCoord) {
                  vec3 projCoords = shadowCoord.xyz / shadowCoord.w;
                  projCoords = projCoords * 0.5 + 0.5;
                  if (projCoords.x < 0.0 || projCoords.x > 1.0 ||
                      projCoords.y < 0.0 || projCoords.y > 1.0 ||
                      projCoords.z < 0.0 || projCoords.z > 1.0) {
                    return 1.0;
                  }
                  float closestDepth = texture2D(uShadowMap, projCoords.xy).r;
                  float currentDepth = projCoords.z;
                  float bias = 0.005;
                  return (currentDepth - bias) < closestDepth ? 0.0 : 1.0;
                }
        
                void main() {
                  vec3 normal = normalize(vWorldNormal);
                  vec3 viewDir = normalize(cameraPosition - vWorldPos);
                  vec3 lightDir = normalize(uLightPos - vWorldPos);
        
                  float diff = max(dot(normal, lightDir), 0.0);
                  vec3 diffuse = uLightColor * diff * 0.45;
        
                  vec3 halfDir = normalize(lightDir + viewDir);
                  float spec = pow(max(dot(normal, halfDir), 0.0), 1.0 / max(0.01, 1.0 - uGlossiness));
                  vec3 specular = uSpecColor * spec * uMetalness * 0.15;
        
                  float fresnel = pow(1.0 - max(dot(viewDir, normal), 0.0), 3.0);
                  vec3 fresnelCol = fresnel * 0.08 * mix(uColorA, uColorC, 0.5);
        
                  float shadow = sampleShadow(vShadowCoord);
        
                  vec3 baseCol;
                  float t = clamp(vDisplacement * 3.0 + 0.5, 0.0, 1.0);
                  if(t < 0.5) {
                      baseCol = mix(uColorA, uColorB, t * 2.0);
                  } else {
                      baseCol = mix(uColorB, uColorC, (t - 0.5) * 2.0);
                  }
        
                  vec3 finalCol = baseCol * (0.2 + 0.8 * shadow * diffuse) + specular + fresnelCol;
                  finalCol += baseCol * 0.12;
        
                  float pulse = 0.5 + 0.5 * sin(uTime * uPulseSpeed);
                  finalCol += vec3(0.004, 0.002, 0.005) * pulse * uPulseAmp;
        
                  finalCol = clamp(finalCol, 0.0, 1.0);
                  finalCol = mix(finalCol, 1.0 - finalCol, uInvert);
                  finalCol *= uBrightness;
        
                  gl_FragColor = vec4(finalCol, 1.0);
                }
            `,
            transparent: false,
            side: THREE.DoubleSide,
            wireframe: false,
        });

        const mainMesh = new THREE.Mesh(mainGeo, mainMat);
        mainMesh.castShadow = true;
        mainMesh.receiveShadow = true;
        scene.add(mainMesh);

        const wireMat = new THREE.MeshBasicMaterial({
            color: 0x002c9c,
            wireframe: true,
            transparent: true,
            opacity: 0.2,
        });
        const wireMesh = new THREE.Mesh(mainGeo.clone(), wireMat);
        wireMesh.scale.set(1.01, 1.01, 1.01);
        wireMesh.castShadow = false;
        wireMesh.receiveShadow = false;
        scene.add(wireMesh);

        const satelliteCount = randInt(1, 10);
        const satellites = [];

        function createSatelliteShader(baseColor, invert, brightness) {
            const hueShift = randRange(0, 1);
            const glitchAmt = randRange(0.2, 0.8);
            const speed = randRange(1.0, 4.0);
            const mode = randInt(0, 4);
            return new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uBaseColor: { value: baseColor.clone() },
                    uInvert: { value: invert ? 1 : 0 },
                    uBrightness: { value: brightness },
                    uHueShift: { value: hueShift },
                    uGlitchAmt: { value: glitchAmt },
                    uSpeed: { value: speed },
                    uMode: { value: mode },
                },
                vertexShader: `
                varying vec3 vPos;
                varying vec3 vNormal;
                void main() {
                  vPos = position;
                  vNormal = normalize(normalMatrix * normal);
                  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
              `,
                fragmentShader: `
                uniform vec3 uBaseColor;
                uniform float uTime;
                uniform float uInvert;
                uniform float uBrightness;
                uniform float uHueShift;
                uniform float uGlitchAmt;
                uniform float uSpeed;
                uniform int uMode;

                varying vec3 vPos;
                varying vec3 vNormal;

                vec3 hsv2rgb(vec3 c) {
                  vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
                  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
                  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
                }

                void main() {
                  vec3 col = uBaseColor;
                  if (uMode == 0) {
                    float hue = uHueShift + uTime * 0.05 * uSpeed;
                    col = hsv2rgb(vec3(hue, 0.9, 0.6));
                  } else if (uMode == 1) {
                    float r = sin(vPos.x * 20.0 + uTime * 15.0 * uSpeed) * uGlitchAmt;
                    float g = cos(vPos.y * 20.0 + uTime * 12.0 * uSpeed) * uGlitchAmt;
                    float b = sin(vPos.z * 20.0 + uTime * 18.0 * uSpeed) * uGlitchAmt;
                    col = vec3(uBaseColor.r + r, uBaseColor.g + g, uBaseColor.b + b);
                  } else if (uMode == 2) {
                    float angle = atan(vPos.z, vPos.x);
                    float radius = length(vPos.xy);
                    float swirl = sin(radius * 10.0 - angle * 4.0 + uTime * uSpeed);
                    float hue = uHueShift + swirl * 0.3;
                    col = hsv2rgb(vec3(hue, 0.9, 0.6));
                  } else if (uMode == 3) {
                    float wave = sin(vPos.x * 5.0 + vPos.y * 5.0 + uTime * uSpeed);
                    col = mix(uBaseColor, 1.0 - uBaseColor, abs(wave) * 0.8);
                  } else {
                    float sparkle = sin(vPos.x * 30.0 + vPos.y * 30.0 + uTime * 20.0 * uSpeed);
                    float hue = uHueShift + uTime * 0.02 * uSpeed;
                    vec3 rainbow = hsv2rgb(vec3(hue, 0.9, 0.6));
                    col = mix(uBaseColor, rainbow, 0.7 * abs(sparkle));
                  }
                  col = mix(col, 1.0 - col, uInvert);
                  col *= uBrightness;
                  gl_FragColor = vec4(col, 0.9);
                }
              `,
                transparent: true,
                side: THREE.DoubleSide,
            });
        }

        for (let i = 0; i < satelliteCount; i++) {
            const c = seededColor();
            const satBrightness = 0.3 + 0.7 * rand();
            const satInvert = rand() > 0.5;
            const size = randRange(0.04, 0.35);
            const geoType = randInt(0, 4);
            let satGeo;
            switch (geoType) {
                case 0:
                    satGeo = new THREE.IcosahedronGeometry(size, randInt(0, 2));
                    break;
                case 1:
                    satGeo = new THREE.OctahedronGeometry(size);
                    break;
                case 2:
                    satGeo = new THREE.DodecahedronGeometry(size);
                    break;
                case 3:
                    satGeo = new THREE.BoxGeometry(size, size * randRange(0.5, 2), size * randRange(0.5, 2));
                    break;
                case 4:
                    satGeo = new THREE.TetrahedronGeometry(size);
                    break;
            }
            const satMat = createSatelliteShader(c, satInvert, satBrightness);
            const sat = new THREE.Mesh(satGeo, satMat);
            sat.castShadow = true;
            sat.receiveShadow = true;
            const angle = randRange(0, Math.PI * 2);
            const radius = randRange(1.8, 6.0);
            const heightOffset = randRange(-2.0, 2.0);
            const speed = randRange(0.1, 2.0);
            const phase = randRange(0, Math.PI * 2);
            const orbitTilt = randRange(-0.8, 0.8);
            sat.userData = {
                angle,
                radius,
                heightOffset,
                speed,
                phase,
                orbitTilt,
                brightness: satBrightness,
                invert: satInvert,
                baseColor: c.clone(),
                mat: satMat,
            };
            scene.add(sat);
            satellites.push(sat);
        }

        const foldGroups = [];
        const foldCount = randInt(1, 8);
        for (let i = 0; i < foldCount; i++) {
            const foldGroup = new THREE.Group();
            const planesPerGroup = randInt(3, 8);
            for (let j = 0; j < planesPerGroup; j++) {
                const w = randRange(4, 12);
                const h = randRange(4, 16);
                const segW = randInt(2, 6);
                const segH = randInt(2, 6);
                const geometry = new THREE.PlaneGeometry(w, h, segW, segH);
                const brightness = 0.2 + rand() * 0.6;
                const c = seededColor();
                const material = new THREE.MeshPhongMaterial({
                    color: c,
                    transparent: true,
                    opacity: 0.7 + 0.3 * rand(),
                    side: THREE.DoubleSide,
                    shininess: 50 + rand() * 150,
                    emissive: c.clone().multiplyScalar(0.2 + rand() * 0.3),
                });
                const plane = new THREE.Mesh(geometry, material);
                plane.castShadow = false;
                plane.receiveShadow = false;
                plane.position.set(randRange(-30, 30), randRange(-20, 20), randRange(-30, 30));
                plane.userData = {
                    originalPos: plane.position.clone(),
                    foldPhase: randRange(0, Math.PI * 4),
                    baseBrightness: brightness,
                    colorShift: randRange(0, 0.5),
                    hueSpeed: randRange(0.02, 0.08),
                };
                foldGroup.add(plane);
            }
            foldGroups.push(foldGroup);
            scene.add(foldGroup);
        }

        const geometricShapes = [];
        const shapeCount = randInt(10, 30);
        for (let i = 0; i < shapeCount; i++) {
            const type = randInt(0, 5);
            let geometry;
            switch (type) {
                case 0:
                    geometry = new THREE.ConeGeometry(randRange(1, 4), randRange(3, 10), randInt(3, 8));
                    break;
                case 1:
                    geometry = new THREE.BoxGeometry(randRange(2, 6), randRange(1, 4), randRange(4, 12));
                    break;
                case 2:
                    geometry = new THREE.CylinderGeometry(randRange(0.5, 3), randRange(1, 5), randRange(4, 12), randInt(4, 10));
                    break;
                case 3:
                    geometry = new THREE.TorusGeometry(randRange(1, 4), randRange(0.2, 1), randInt(8, 24), randInt(8, 24));
                    break;
                case 4:
                    geometry = new THREE.IcosahedronGeometry(randRange(1, 4), randInt(0, 2));
                    break;
                case 5:
                    geometry = new THREE.DodecahedronGeometry(randRange(1, 4));
                    break;
            }
            const brightness = 0.3 + rand() * 0.4;
            const c = seededColor();
            const material = new THREE.MeshPhongMaterial({
                color: c,
                transparent: true,
                opacity: 0.6 + 0.4 * rand(),
                shininess: 50 + rand() * 150,
                emissive: c.clone().multiplyScalar(0.1 + rand() * 0.3),
            });
            const shape = new THREE.Mesh(geometry, material);
            shape.castShadow = false;
            shape.receiveShadow = false;
            shape.position.set(randRange(-40, 40), randRange(-30, 30), randRange(-40, 40));
            shape.userData = {
                originalPos: shape.position.clone(),
                rotationSpeed: new THREE.Vector3(randRange(-0.03, 0.03), randRange(-0.03, 0.03), randRange(-0.03, 0.03)),
                oscillationPhase: randRange(0, Math.PI * 2),
                baseBrightness: brightness,
                mat: material,
                hueOffset: randRange(0, 1),
                hueSpeed: randRange(0.01, 0.06),
            };
            geometricShapes.push(shape);
            scene.add(shape);
        }

        const particleCount = randInt(300, 500);
        const particleGeo = new THREE.BufferGeometry();
        const partPos = new Float32Array(particleCount * 3);
        const partColors = new Float32Array(particleCount * 3);
        const partSizes = new Float32Array(particleCount);
        const spread = motion.particleSpread;
        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            const theta = randRange(0, Math.PI * 2);
            const phi = Math.acos(randRange(-1, 1));
            const r = randRange(0.4, spread * 1.8);
            partPos[i3] = r * Math.sin(phi) * Math.cos(theta);
            partPos[i3 + 1] = r * Math.cos(phi);
            partPos[i3 + 2] = r * Math.sin(phi) * Math.sin(theta);
            const c = seededColor();
            const bright = 0.2 + 0.6 * rand();
            const invert = rand() > 0.5;
            partColors[i3] = invert ? (1 - c.r) * bright : c.r * bright;
            partColors[i3 + 1] = invert ? (1 - c.g) * bright : c.g * bright;
            partColors[i3 + 2] = invert ? (1 - c.b) * bright : c.b * bright;
            partSizes[i] = randRange(0.01, 0.15);
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(partColors, 3));
        particleGeo.setAttribute('size', new THREE.BufferAttribute(partSizes, 1));

        const partMat = new THREE.PointsMaterial({
            size: 0.035,
            vertexColors: true,
            transparent: true,
            opacity: 0.7 + 0.3 * rand(),
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particleSystem = new THREE.Points(particleGeo, partMat);
        scene.add(particleSystem);

        const ringCount = randInt(3, 12);
        const rings = [];
        for (let i = 0; i < ringCount; i++) {
            const r = randRange(0.5, 3.0);
            const t = randRange(0.02, 0.15);
            const seg = randInt(12, 64);
            const ringGeo = new THREE.TorusGeometry(r, t, 8, seg);
            const c = seededColor();
            const bright = 0.3 + 0.4 * rand();
            const invert = rand() > 0.5;
            const ringMat = new THREE.MeshBasicMaterial({
                color: invert ? new THREE.Color(1 - c.r, 1 - c.g, 1 - c.b).multiplyScalar(bright) : c.clone().multiplyScalar(
                    bright),
                transparent: true,
                opacity: 0.1 + 0.3 * rand(),
                wireframe: rand() > 0.5,
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.castShadow = false;
            ring.receiveShadow = false;
            ring.rotation.x = randRange(0, Math.PI * 2);
            ring.rotation.y = randRange(0, Math.PI * 2);
            ring.position.set(randRange(-2.0, 2.0), randRange(-1.0, 1.0), randRange(-2.0, 2.0));
            ring.userData = {
                rotSpeedX: randRange(-0.8, 0.8),
                rotSpeedY: randRange(-0.8, 0.8),
                rotSpeedZ: randRange(-0.8, 0.8),
                orbitSpeed: randRange(0.1, 0.9),
                orbitRadius: randRange(0.3, 2.2),
                phase: randRange(0, Math.PI * 2),
                mat: ringMat,
                hueOffset: randRange(0, 1),
                hueSpeed: randRange(0.02, 0.08),
                baseColor: c.clone(),
                invert: invert,
                bright: bright,
            };
            scene.add(ring);
            rings.push(ring);
        }

        const cloudTexture = new THREE.CanvasTexture((() => {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.4, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return canvas;
        })());

        const cloudShader = {
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D map;
                uniform vec3 fogColor;
                uniform float fogNear;
                uniform float fogFar;
                varying vec2 vUv;
                void main() {
                    float depth = gl_FragCoord.z / gl_FragCoord.w;
                    float fogFactor = smoothstep(fogNear, fogFar, depth);
                    gl_FragColor = texture2D(map, vUv);
                    gl_FragColor.w *= pow(gl_FragCoord.z, 20.0);
                    gl_FragColor = mix(gl_FragColor, vec4(fogColor, gl_FragColor.w), fogFactor);
                }
            `,
        };

        const cloudFog = new THREE.Fog(0x4584b4, -100, 3000);
        const cloudMat = new THREE.ShaderMaterial({
            uniforms: {
                map: { value: cloudTexture },
                fogColor: { value: cloudFog.color },
                fogNear: { value: cloudFog.near },
                fogFar: { value: cloudFog.far },
            },
            vertexShader: cloudShader.vertexShader,
            fragmentShader: cloudShader.fragmentShader,
            depthWrite: false,
            depthTest: false,
            transparent: true,
        });

        const cloudCount = randInt(2000, 8000);
        const cloudGeos = [];
        for (let i = 0; i < cloudCount; i++) {
            const planeGeo = new THREE.PlaneGeometry(randRange(20, 80), randRange(20, 80));
            const obj = new THREE.Object3D();
            obj.position.set(randRange(-500, 500), randRange(-200, -20), randRange(-500, 500));
            obj.rotation.z = randRange(0, Math.PI * 2);
            const sc = randRange(0.5, 2.0);
            obj.scale.set(sc, sc, sc);
            obj.updateMatrix();
            const clone = planeGeo.clone();
            clone.applyMatrix4(obj.matrix);
            cloudGeos.push(clone);
        }
        const mergedClouds = mergeGeometries(cloudGeos);
        const cloudMesh = new THREE.Mesh(mergedClouds, cloudMat);
        cloudMesh.renderOrder = 0;
        scene.add(cloudMesh);

        const cloudMesh2 = cloudMesh.clone();
        cloudMesh2.position.z = -2000;
        cloudMesh2.renderOrder = 0;
        scene.add(cloudMesh2);

        const clock = new THREE.Clock();

        function animate() {
            const elapsed = clock.getElapsedTime();
        
            controls.update();
        
            bgMat.uniforms.uTime.value = elapsed;
            mainMat.uniforms.uTime.value = elapsed;
            mainMat.uniforms.uShadowMatrix.value = keyLight.shadow.matrix;
        
            const seedChaos = motion.chaosFactor || 1.0;
            const ambientHue = (elapsed * 0.03 * seedChaos) % 1.0;
            ambientLight.color.setHSL(ambientHue, 0.8, 0.12);
            ambientLight.intensity = 0.2 + 0.15 * Math.sin(elapsed * 1.2 * seedChaos);
            const pulseFactor = Math.sin(elapsed * motion.pulseSpeed * 0.5) * 0.5 + 0.5;
        
            mainMesh.rotation.x = elapsed * motion.rotSpeedX * 0.3 + Math.sin(elapsed * 0.2 * seedChaos) * 0.15;
            mainMesh.rotation.y = elapsed * motion.rotSpeedY * 0.3 + Math.cos(elapsed * 0.25 * seedChaos) * 0.15;
            mainMesh.rotation.z = elapsed * motion.rotSpeedZ * 0.3 + Math.sin(elapsed * 0.15) * 0.1;

            
            const bob = Math.sin(elapsed * motion.bobSpeed) * motion.bobAmp * 0.4 + Math.cos(elapsed * 1.2) * 0.05;
            mainMesh.position.y = bob;
            const chaosOffset = Math.sin(elapsed * seedChaos * 0.5) * 0.3 + Math.cos(elapsed * 0.3) * 0.1;
            mainMesh.position.x = chaosOffset;
            mainMesh.position.z = Math.sin(elapsed * 0.4) * 0.2;
        
            wireMesh.rotation.copy(mainMesh.rotation);
            wireMesh.position.copy(mainMesh.position);
            const wireScale = 1 + 0.03 * Math.sin(elapsed * 3.0);
            wireMesh.scale.set(wireScale, wireScale, wireScale);
        
            for (const sat of satellites) {
                const { angle, radius, heightOffset, speed, phase, orbitTilt, mat } = sat.userData;
                const a = angle + elapsed * speed * 0.4 + Math.sin(elapsed * 0.1 + phase) * 0.2;
                const currentRadius = radius + Math.sin(elapsed * 0.5 + phase) * 0.4;
                const x = Math.cos(a) * currentRadius;
                const z = Math.sin(a) * currentRadius;
                const y = heightOffset + Math.sin(elapsed * speed * 0.7 + phase) * 0.8 + Math.cos(elapsed * 0.3) * 0.3;

                sat.position.set(x, y, z);
                sat.rotation.x = elapsed * 0.5 + phase + orbitTilt + Math.sin(elapsed + phase);
                sat.rotation.y = elapsed * 0.3 + phase * 0.5 + Math.cos(elapsed * 0.8);
                sat.rotation.z = orbitTilt * 0.5 + Math.sin(elapsed * 0.4);

                const scale = 1 + 0.35 * Math.sin(elapsed * 0.8 + phase) * pulseFactor;
                sat.scale.set(scale, scale, scale);
            
                if (mat.uniforms) mat.uniforms.uTime.value = elapsed;
            }
        
            foldGroups.forEach((group) => {
                group.children.forEach((plane) => {
                    const userData = plane.userData;
                    const foldAmount = Math.sin(elapsed * 0.5 + userData.foldPhase) * 1.2;
                    plane.rotation.x = foldAmount + Math.sin(elapsed * 0.2) * 0.2;
                    plane.rotation.y = Math.cos(elapsed * 0.3 + userData.foldPhase) * 0.8;
                    plane.rotation.z = Math.sin(elapsed * 0.7 + userData.foldPhase) * 0.6;

                    plane.position.copy(userData.originalPos);
                    plane.position.x += Math.sin(elapsed * 0.4 + userData.foldPhase) * 10 + Math.cos(elapsed * 0.2) * 2;
                    plane.position.y += Math.cos(elapsed * 0.6 + userData.foldPhase) * 8 + Math.sin(elapsed * 0.3) * 2;
                    plane.position.z += Math.sin(elapsed * 0.8 + userData.foldPhase) * 14;

                    const brightnessModulation = Math.sin(elapsed * 2.5 + userData.foldPhase) * 0.35 + 0.65;
                    const brightness = Math.min(0.9, userData.baseBrightness * brightnessModulation);
                    const hue = (userData.colorShift + elapsed * userData.hueSpeed * 0.8) % 1;
                    const col = new THREE.Color().setHSL(hue, 0.85 + 0.15 * Math.sin(elapsed * 0.5 + userData.foldPhase), brightness);

                    plane.material.color.copy(col);
                    plane.material.emissive.copy(col).multiplyScalar(0.4 + 0.4 * Math.sin(elapsed * 0.7 + userData.foldPhase));
                });
                group.rotation.y = Math.sin(elapsed * 0.2) * 0.4 + Math.cos(elapsed * 0.1) * 0.2;
                group.rotation.x = Math.cos(elapsed * 0.15) * 0.15;
            });
        
            geometricShapes.forEach((shape) => {
                const userData = shape.userData;
                shape.rotation.x += userData.rotationSpeed.x * (1 + pulseFactor * 0.5);
                shape.rotation.y += userData.rotationSpeed.y * (1 + pulseFactor * 0.5);
                shape.rotation.z += userData.rotationSpeed.z;

                shape.position.copy(userData.originalPos);
                shape.position.x += Math.sin(elapsed * 0.5 + userData.oscillationPhase) * 18 + Math.cos(elapsed * 0.3) * 4;
                shape.position.y += Math.cos(elapsed * 0.7 + userData.oscillationPhase) * 14 + Math.sin(elapsed * 0.4) * 4;
                shape.position.z += Math.sin(elapsed * 0.9 + userData.oscillationPhase) * 10;

                const brightnessModulation = Math.sin(elapsed * 3.5 + userData.oscillationPhase) * 0.45 + 0.55;
                const brightness = Math.min(0.85, userData.baseBrightness * brightnessModulation);
                const hue = (userData.hueOffset + elapsed * userData.hueSpeed) % 1;
                const col = new THREE.Color().setHSL(hue, 0.85 + 0.15 * Math.sin(elapsed * 0.5 + userData.oscillationPhase), brightness * 0.7);

                shape.material.color.copy(col);
                shape.material.emissive.copy(col).multiplyScalar(0.4 + 0.4 * Math.sin(elapsed * 0.8 + userData.oscillationPhase));

                const scale = 1 + Math.sin(elapsed * 2.5 + userData.oscillationPhase) * 0.4;
                shape.scale.setScalar(scale);
            });
        
            const pos = particleSystem.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const px = pos[i3];
                const py = pos[i3 + 1];
                const pz = pos[i3 + 2];
            
                const angleStep = 0.0008 * seedChaos;
                const cosA = Math.cos(angleStep);
                const sinA = Math.sin(angleStep);
                pos[i3] = px * cosA - pz * sinA;
                pos[i3 + 2] = px * sinA + pz * cosA;
            
                pos[i3] += Math.sin(elapsed * 0.15 + i * 0.001) * 0.0008;
                pos[i3 + 1] += Math.cos(elapsed * 0.12 + i * 0.0013) * 0.0008;
                pos[i3 + 2] += Math.sin(elapsed * 0.14 + i * 0.0017) * 0.0008;
            
                const r = Math.sqrt(pos[i3] * pos[i3] + pos[i3 + 1] * pos[i3 + 1] + pos[i3 + 2] * pos[i3 + 2]);
                if (r > spread * 1.9 || r < spread * 0.2) {
                    pos[i3] *= 0.97;
                    pos[i3 + 1] *= 0.97;
                    pos[i3 + 2] *= 0.97;
                }
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;
            particleSystem.rotation.y = elapsed * 0.02;
            particleSystem.rotation.x = Math.sin(elapsed * 0.01 + seedChaos) * 0.12;
        
            for (const ring of rings) {
                const { rotSpeedX, rotSpeedY, rotSpeedZ, orbitSpeed, orbitRadius, phase, mat, baseColor, invert, bright, hueSpeed, hueOffset } = ring.userData;

                ring.rotation.x += rotSpeedX * 0.02;
                ring.rotation.y += rotSpeedY * 0.02;
                ring.rotation.z += rotSpeedZ * 0.02;

                const a = elapsed * orbitSpeed + phase;
                ring.position.x = Math.cos(a) * (orbitRadius + Math.sin(elapsed * 0.3 + phase) * 0.5) + Math.sin(elapsed * 0.25 + phase) * 0.3;
                ring.position.z = Math.sin(a) * (orbitRadius + Math.cos(elapsed * 0.3 + phase) * 0.5) + Math.cos(elapsed * 0.35 + phase) * 0.3;
                ring.position.y = Math.sin(elapsed * 0.4 + phase) * 0.6 + Math.cos(elapsed * 0.25 + phase) * 0.3;

                const sc = 1 + 0.25 * Math.sin(elapsed * 0.6 + phase) * pulseFactor;
                ring.scale.set(sc, sc, sc);
            
                const hue = (hueOffset + elapsed * hueSpeed) % 1;
                const sat = 0.85 + 0.15 * Math.sin(elapsed * 0.4 + phase);
                const light = Math.min(0.65, bright * 0.65);
                const col = new THREE.Color().setHSL(hue, sat, light);

                if (invert) {
                    mat.color.setRGB(1 - col.r, 1 - col.g, 1 - col.b);
                } else {
                    mat.color.copy(col);
                }
            }
        
            const cloudPos = (elapsed * 60.0) % 8000;
            cloudMesh.position.z = -cloudPos + 4000;
            cloudMesh2.position.z = -cloudPos + 2000;
        
            bloomPass.strength = 0.18 + 0.25 * (0.5 + 0.5 * Math.sin(elapsed * 0.08 + seedChaos)) * pulseFactor;
        
            composer.render();
            requestAnimationFrame(animate);
        }

        animate();

        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            composer.setSize(w, h);
            updateSeedDisplay();
        }
        window.addEventListener('resize', onResize);
        if (window.ResizeObserver) {
            const ro = new ResizeObserver(() => onResize());
            ro.observe(container);
        }

        window.__CHAOS = {
            seed: SEED_RAW,
            seed64: seed64,
            visitorCount: visitorCount,
            scene: scene,
            camera: camera,
            renderer: renderer,
            composer: composer,
            controls: controls,
        };

        console.log('CHAOS ready. Visitors:', visitorCount);
        console.log('Seed:', SEED_RAW);
        console.log('Geometry type:', geoParams.type);
        console.log('Chaos factor:', motion.chaosFactor);
        console.log('Light position:', lightPos.x.toFixed(2), lightPos.y.toFixed(2), lightPos.z.toFixed(2));
    </script>
</body>
