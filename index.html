            }
            float D_GGX(float NoH, float a) { float a2 = a * a; float d = NoH * NoH * (a2 - 1.0) + 1.0; return a2 / (PI * d * d); }
            float V_Smith(float NoV, float NoL, float a) { float a2 = a * a; float gv = NoL * sqrt(NoV * NoV * (1.0 - a2) + a2); float gl = NoV * sqrt(NoL * NoL * (1.0 - a2) + a2); return 0.5 / max(gv + gl, 1e-4); }
            // a synthetic studio: a broad soft top light plus the key, blurred by roughness
            vec3 studioEnv(vec3 R, float rough) {
              vec3 e = uAmbient * (0.55 + 0.45 * R.y);
              for (int i = 0; i < 3; i++) {
                float c = saturate(dot(R, uLightDir[i]));
                e += uLightCol[i] * pow(c, mix(48.0, 2.0, rough)) * mix(0.9, 0.25, rough);
              }
              return e;
            }

            void main() {
              if (!gl_FrontFacing) {
                // looking into a crease you end up behind another sac's shell: deep in the fruit, dark
                gl_FragColor = vec4(uTransColor * uAmbient * 0.08, 1.0);
                return;
              }
              // ---- normals ----------------------------------------------------
              vec3 toC = vModelPos - vCenter;
              float beadR = max(length(toC), 1e-3);
              vec3 nBead = toC / beadR;
              float domeW = smoothstep(0.05, 0.6, vMask.x) * (0.5 + 0.5 * vMask.y);
              vec3 nBase = normalize(mix(normalize(vNormalModel), nBead, domeW));
              // pores / epidermal cells: gradient of a fine 3D noise
              vec3 pp = vModelPos * uPoreScale;
              float e = 0.35;
              vec3 g = vec3(noise(pp + vec3(e, 0, 0)) - noise(pp - vec3(e, 0, 0)),
                            noise(pp + vec3(0, e, 0)) - noise(pp - vec3(0, e, 0)),
                            noise(pp + vec3(0, 0, e)) - noise(pp - vec3(0, 0, e)));
              float dh = noise(pp);
              vec3 N = normalize(nBase + g * uPoreStrength);
              vec3 V = normalize(uCamM - vModelPos);
              float NoV = saturate(dot(N, V));

              float ao = mix(0.28, 1.0, vMask.y) * mix(0.75, 1.0, vMask.x);
              float roughness = clamp(uRoughness + (1.0 - vMask.y) * 0.25 + (dh - 0.5) * 0.12, 0.045, 1.0);

              // ---- diffuse + subsurface (analytic stand-in for the baked transfer) ----
              float t = clamp(vDisplacement * 3.0 + 0.5, 0.0, 1.0);
              vec3 albedo = mix(uAlbedo, uAlbedo2, t);
              vec3 irr = uAmbient * (0.6 + 0.4 * nBase.y) * PI;
              for (int i = 0; i < 3; i++) {
                float nl = dot(nBase, uLightDir[i]);
                float wrap = saturate((nl + 0.45) / 1.45);          // flesh scatters light round the terminator
                irr += uLightCol[i] * wrap * wrap * PI;
              }
              vec3 aoC = pow(vec3(ao), vec3(1.0) - 0.75 * albedo / max(max(albedo.r, max(albedo.g, albedo.b)), 1e-3));
              vec3 sss = pow(albedo, vec3(0.85, 1.25, 1.25)) * irr * (0.75 / PI) * aoC;

              // ---- translucency: each sac as a turbid bead ----------------------
              vec3 sigma = -log(clamp(uTransColor, vec3(0.002), vec3(0.999))) / uTransDepth;
              float open = 0.3 + 0.7 * ao;
              vec3 nS = nBead;                                        // bead normal (pos - centre), as in the original
              vec3 outward = normalize(vNormalModel);
              // (a) light entering the lit side of the sac, glowing out past the terminator
              vec3 bead = vec3(0.0);
              for (int i = 0; i < 3; i++) {
                vec3 Lm = uLightDir[i];
                float nl = dot(nS, Lm);
                float chord = 2.0 * beadR * max(-nl, 0.0) + 0.10;
                float past = smoothstep(0.45, -0.30, nl);
                float reach = smoothstep(-0.45, 0.20, dot(outward, Lm));
                bead += uLightCol[i] * exp(-sigma * chord) * past * reach;
              }
              bead *= 0.07 * uBead * open * 2.5;
              // (b) looking through the sac at the backdrop
              vec3 Tr = refract(-V, nBase, 1.0 / 1.33);
              float chordV = max(2.0 * dot(-toC, Tr), 0.0);
              float leave = smoothstep(0.30, 0.85, 1.0 - saturate(dot(outward, V)));
              leave *= smoothstep(0.12, 0.60, ao);
              vec3 through = uBackdrop * exp(-sigma * (chordV + 0.06)) * leave * (0.25 + 0.75 * vMask.z) * uSeeThrough * 0.55;
              // (c) the seed, a pale blur inside
              float SEED_R = beadR * 0.3;
              float sb = dot(-toC, Tr);
              float sh = sb * sb - (beadR * beadR - SEED_R * SEED_R);
              float seedHit = smoothstep(0.0, SEED_R * SEED_R * 0.9, sh) * step(0.0, sb);
              float sd = max(sb - sqrt(max(sh, 0.0)), 0.0);
              vec3 seedLight = uAmbient * open + bead * 2.0;
              vec3 seed = vec3(0.80, 0.56, 0.30) * seedLight * exp(-sigma * (sd + 0.03)) * seedHit * uSeedAmt;

              vec3 glow = bead + through + seed;
              float seeThrough = leave * saturate(uSeeThrough);
              vec3 diffuse = sss * uSSS * (1.0 - 0.35 * seeThrough) + glow;

              // ---- specular: GGX from the three lights + the synthetic studio ----
              vec3 spec = vec3(0.0);
              float a = roughness * roughness;
              for (int i = 0; i < 3; i++) {
                vec3 L = uLightDir[i];
                vec3 H = normalize(L + V);
                float NoL = saturate(dot(N, L)), NoH = saturate(dot(N, H)), VoH = saturate(dot(V, H));
                float F = uF0 + (1.0 - uF0) * pow(1.0 - VoH, 5.0);
                spec += uLightCol[i] * D_GGX(NoH, a) * V_Smith(NoV, NoL, a) * F * NoL;
              }
              vec3 R = reflect(-V, N);
              R = normalize(mix(R, N, roughness * roughness));
              vec2 dfg = envBRDF(roughness, NoV);
              float so = saturate(pow(NoV + ao, exp2(-16.0 * roughness - 1.0)) - 1.0 + ao);
              float horizon = saturate(1.0 + dot(R, nBase));
              so *= horizon * horizon;
              float cavity = mix(1.0, 0.55 + 0.45 * dh, saturate(uPoreStrength * 2.0));
              spec += studioEnv(R, roughness) * (uF0 * dfg.x + dfg.y) * so * cavity;
              spec *= uSpecular;

              // ---- velvet from the hairs that are too fine to draw ----
              float fres = pow(1.0 - NoV, 3.0);
              float localLight = dot(sss, vec3(0.33)) * 2.2;
              vec3 sheen = uSheenColor * localLight * fres * uSheen * (0.4 + 0.6 * ao);

              vec3 col = diffuse + spec + sheen;

              // ---- blueberry bloom: the dusty wax that sits in the hollows and at the limb ----
              float wax = smoothstep(0.35, 0.8, fbm(vModelPos * uBloomScale + 7.0)) * uBloom;
              wax *= (0.5 + 0.5 * pow(1.0 - NoV, 1.5)) * mix(0.6, 1.0, vMask.y);
              vec3 waxCol = vec3(0.78, 0.80, 0.88) * (uAmbient + 0.25 * (uLightCol[0] + uLightCol[1] + uLightCol[2])) * 0.5;
              col = mix(col, waxCol, saturate(wax));

              col += albedo * 0.02 * uPulse;
              gl_FragColor = vec4(max(col, 0.0), 1.0);
            }
        `;

        const motion = getMotionParams();

        // =====================================================================
        //  MUTATION CLOCK — the dimension keeps mutating the longer you stay in it.
        //  Growth compounds (dv ∝ 0.25 + v, so it starts slow and accelerates),
        //  every palette jump kicks it a little further, and it saturates at 1.5.
        //  Calm moods mutate slower, wild ones faster.
        // =====================================================================
        const mutation = { v: 0, rate: randRange(0.005, 0.02), max: 1.5, lineage };
        function updateMutation(dt) {
            mutation.v = Math.min(mutation.max, mutation.v + dt * mutation.rate * (0.25 + mutation.v) * ml(0.6, 1.4));
        }

        function makeBerryMaterial(o) {
            return new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uChaos: { value: o.chaos },
                    uNoiseScale: { value: o.noiseScale },
                    uDispStrength: { value: o.dispStrength },
                    uMutate: { value: 0 },
                    uCellScale: { value: o.cellScale },
                    uDomeR: { value: o.domeR },
                    uDomeAmp: { value: o.domeAmp },
                    uSeedOff: { value: new THREE.Vector3(randRange(0, 100), randRange(0, 100), randRange(0, 100)) },
                    uAlbedo: { value: new THREE.Color() },
                    uAlbedo2: { value: new THREE.Color() },
                    uTransColor: { value: new THREE.Color() },
                    uTransDepth: { value: o.transDepth },
                    uBackdrop: { value: new THREE.Color() },
                    uCamM: { value: new THREE.Vector3() },
                    uLightDir: { value: [new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 1, 0)] },
                    uLightCol: { value: [new THREE.Color(), new THREE.Color(), new THREE.Color()] },
                    uAmbient: { value: new THREE.Color() },
                    uBead: { value: o.bead },
                    uSeeThrough: { value: o.seeThrough },
                    uSeedAmt: { value: o.seedAmt },
                    uSSS: { value: 1 },
                    uRoughness: { value: o.roughness },
                    uF0: { value: o.f0 },
                    uSpecular: { value: o.specular },
                    uSheen: { value: o.sheen },
                    uSheenColor: { value: new THREE.Color(1, 1, 1) },
                    uPoreScale: { value: o.poreScale },
                    uPoreStrength: { value: o.poreStrength },
                    uBloom: { value: o.bloom },
                    uBloomScale: { value: o.bloomScale },
                    uPulse: { value: 0 },
                },
                vertexShader: BERRY_VERT,
                fragmentShader: BERRY_FRAG,
                side: THREE.DoubleSide,
            });
        }

        // the main berry: every seed grows a different skin
        const skin = {
            chaos: motion.chaosFactor,
            noiseScale: randRange(0.6, 2.4),
            dispStrength: randRange(0.1, 0.4),
            cellScale: randRange(1.6, 7.5) * (3.0 / Math.max(1.5, mainRadius)),
            domeR: randRange(0.45, 0.72),
            domeAmp: randRange(0.05, 0.28) * Math.max(0.8, mainRadius / 3),
            transDepth: randRange(0.1, 0.45),
            bead: randRange(0.6, 1.6),
            seeThrough: randRange(0.3, 1.2),
            seedAmt: rand() < 0.6 ? randRange(0.1, 0.5) : 0,
            roughness: randRange(0.08, 0.45),
            f0: Math.pow((1.33 - 1) / (1.33 + 1), 2) * randRange(0.8, 2.5),
            specular: randRange(0.6, 1.6),
            sheen: randRange(0.1, 0.9),
            poreScale: randRange(18, 70),
            poreStrength: randRange(0.05, 0.5),
            bloom: rand() < 0.65 ? randRange(0.2, 0.9) : 0,     // blueberry wax, most of the time
            bloomScale: randRange(0.4, 3.0),
        };
        const mainMat = makeBerryMaterial(skin);
        const berryMats = [mainMat];

        const mainMesh = new THREE.Mesh(mainGeo, mainMat);
        mainMesh.castShadow = true;
        mainMesh.receiveShadow = true;
        scene.add(mainMesh);

        const wireMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: randRange(0.04, 0.16) });
        const wireMesh = new THREE.Mesh(mainGeo.clone(), wireMat);
        wireMesh.scale.set(1.01, 1.01, 1.01);
        scene.add(wireMesh);

        // ---- satellites: a swarm, half of them small berries of their own ----
        const satelliteCount = randInt(2, 14);
        const satellites = [];

        function createSatelliteShader(baseColor, invert, brightness) {
            const glitchAmt = randRange(0.2, 0.8);
            const speed = randRange(1.0, 4.0);
            const mode = randInt(0, 4);
            return new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uBaseColor: { value: baseColor.clone() },
                    uInvert: { value: invert ? 1 : 0 },
                    uBrightness: { value: brightness },
                    uGlitchAmt: { value: glitchAmt },
                    uSpeed: { value: speed },
                    uMode: { value: mode },
                },
                vertexShader: `
                varying vec3 vPos; varying vec3 vNormal;
                void main() { vPos = position; vNormal = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
              `,
                fragmentShader: `
                uniform vec3 uBaseColor; uniform float uTime, uInvert, uBrightness, uGlitchAmt, uSpeed; uniform int uMode;
                varying vec3 vPos; varying vec3 vNormal;
                void main() {
                  vec3 col = uBaseColor;
                  if (uMode == 0) { col = vec3(0.5 + 0.5 * sin(uTime * uSpeed + vNormal.y * 3.0)); }
                  else if (uMode == 1) { float r = sin(vPos.x * 20.0 + uTime * 15.0 * uSpeed) * uGlitchAmt; col = uBaseColor + r; }
                  else if (uMode == 2) { float angle = atan(vPos.z, vPos.x); float radius = length(vPos.xy); col = vec3(0.5 + 0.5 * sin(radius * 10.0 - angle * 4.0 + uTime * uSpeed)); }
                  else if (uMode == 3) { float wave = sin(vPos.x * 5.0 + vPos.y * 5.0 + uTime * uSpeed); col = mix(uBaseColor, 1.0 - uBaseColor, abs(wave) * 0.8); }
                  else { float sparkle = sin(vPos.x * 30.0 + vPos.y * 30.0 + uTime * 20.0 * uSpeed); col = mix(uBaseColor, vec3(1.0), 0.7 * abs(sparkle)); }
                  col = mix(col, 1.0 - col, uInvert);
                  col *= uBrightness;
                  gl_FragColor = vec4(col, 0.9);
                }
              `,
                transparent: true,
                side: THREE.DoubleSide,
            });
        }

        for (let i = 0; i < satelliteCount; i++) {
            const c = seededColor();
            const satBrightness = 0.3 + 0.7 * rand();
            const satInvert = rand() > 0.5;
            const size = randRange(0.08, 0.7);
            const geoType = randInt(0, 5);
            let satGeo;
            switch (geoType) {
                case 0: satGeo = new THREE.IcosahedronGeometry(size, randInt(1, 3)); break;
                case 1: satGeo = new THREE.OctahedronGeometry(size, randInt(0, 2)); break;
                case 2: satGeo = new THREE.DodecahedronGeometry(size, randInt(0, 2)); break;
                case 3: satGeo = new THREE.BoxGeometry(size, size * randRange(0.5, 2), size * randRange(0.5, 2), 6, 6, 6); break;
                case 4: satGeo = new THREE.TetrahedronGeometry(size, randInt(0, 2)); break;
                case 5: satGeo = new THREE.TorusKnotGeometry(size * 0.6, size * 0.2, 80, 12, randInt(1, 4), randInt(2, 5)); break;
            }
            let satMat;
            if (rand() < 0.55) {
                satMat = makeBerryMaterial({
                    chaos: motion.chaosFactor,
                    noiseScale: randRange(1.5, 4), dispStrength: randRange(0.01, 0.06),
                    cellScale: randRange(6, 18), domeR: randRange(0.45, 0.7), domeAmp: randRange(0.01, 0.05),
                    transDepth: randRange(0.05, 0.2), bead: randRange(0.6, 1.5), seeThrough: randRange(0.3, 1), seedAmt: randRange(0, 0.4),
                    roughness: randRange(0.08, 0.4), f0: 0.02 * randRange(0.8, 2.5), specular: randRange(0.7, 1.5), sheen: randRange(0.1, 0.8),
                    poreScale: randRange(40, 120), poreStrength: randRange(0.05, 0.4), bloom: rand() < 0.6 ? randRange(0.2, 0.9) : 0, bloomScale: randRange(2, 8),
                });
                berryMats.push(satMat);
            } else {
                satMat = createSatelliteShader(c, satInvert, satBrightness);
            }
            const sat = new THREE.Mesh(satGeo, satMat);
            sat.castShadow = true;
            sat.receiveShadow = true;
            sat.userData = {
                angle: randRange(0, Math.PI * 2),
                radius: randRange(mainRadius * 0.9, mainRadius * 2.2),
                heightOffset: randRange(-3.0, 3.0),
                speed: randRange(0.1, 2.0),
                phase: randRange(0, Math.PI * 2),
                orbitTilt: randRange(-0.8, 0.8),
                mat: satMat,
            };
            scene.add(sat);
            satellites.push(sat);
        }

        // ---- folding planes ----
        const foldGroups = [];
        const foldCount = randInt(1, 8);
        for (let i = 0; i < foldCount; i++) {
            const foldGroup = new THREE.Group();
            const planesPerGroup = randInt(3, 8);
            for (let j = 0; j < planesPerGroup; j++) {
                const w = randRange(4, 14), h = randRange(4, 18);
                const geometry = new THREE.PlaneGeometry(w, h, randInt(2, 6), randInt(2, 6));
                const brightness = 0.2 + rand() * 0.6;
                const c = seededColor();
                const material = new THREE.MeshPhongMaterial({
                    color: c, transparent: true, opacity: 0.45 + 0.35 * rand(), side: THREE.DoubleSide,
                    shininess: 50 + rand() * 150, emissive: c.clone().multiplyScalar(0.2 + rand() * 0.3),
                });
                const plane = new THREE.Mesh(geometry, material);
                plane.position.set(randRange(-36, 36), randRange(-24, 24), randRange(-36, 36));
                plane.userData = { originalPos: plane.position.clone(), foldPhase: randRange(0, Math.PI * 4), baseBrightness: brightness, colorShift: randRange(0, 0.5), hueSpeed: randRange(0.02, 0.08) };
                foldGroup.add(plane);
            }
            foldGroups.push(foldGroup);
            scene.add(foldGroup);
        }

        // ---- drifting geometric debris ----
        const geometricShapes = [];
        const shapeCount = randInt(12, 36);
        for (let i = 0; i < shapeCount; i++) {
            const type = randInt(0, 6);
            let geometry;
            switch (type) {
                case 0: geometry = new THREE.ConeGeometry(randRange(1, 5), randRange(3, 12), randInt(3, 8)); break;
                case 1: geometry = new THREE.BoxGeometry(randRange(2, 7), randRange(1, 5), randRange(4, 14)); break;
                case 2: geometry = new THREE.CylinderGeometry(randRange(0.5, 3), randRange(1, 5), randRange(4, 14), randInt(4, 10)); break;
                case 3: geometry = new THREE.TorusGeometry(randRange(1, 5), randRange(0.2, 1.2), randInt(8, 24), randInt(8, 24)); break;
                case 4: geometry = new THREE.IcosahedronGeometry(randRange(1, 5), randInt(0, 2)); break;
                case 5: geometry = new THREE.DodecahedronGeometry(randRange(1, 5)); break;
                case 6: geometry = new THREE.TorusKnotGeometry(randRange(1, 3), randRange(0.2, 0.8), 64, 10, randInt(1, 4), randInt(2, 7)); break;
            }
            const brightness = 0.3 + rand() * 0.4;
            const c = seededColor();
            const material = new THREE.MeshPhongMaterial({ color: c, transparent: true, opacity: 0.6 + 0.4 * rand(), shininess: 50 + rand() * 150, emissive: c.clone().multiplyScalar(0.1 + rand() * 0.3) });
            const shape = new THREE.Mesh(geometry, material);
            shape.position.set(randRange(-48, 48), randRange(-34, 34), randRange(-48, 48));
            shape.userData = {
                originalPos: shape.position.clone(),
                rotationSpeed: new THREE.Vector3(randRange(-0.03, 0.03), randRange(-0.03, 0.03), randRange(-0.03, 0.03)),
                oscillationPhase: randRange(0, Math.PI * 2), baseBrightness: brightness, mat: material, hueOffset: randRange(0, 1), hueSpeed: randRange(0.01, 0.06),
            };
            geometricShapes.push(shape);
            scene.add(shape);
        }

        // ---- particles ----
        const particleCount = randInt(400, 900);
        BOOT.stage(80, 'ORBITS', 'ORBIT', satellites.length + ' satellites  ·  ' + particleCount.toLocaleString() + ' particles');
        const particleGeo = new THREE.BufferGeometry();
        const partPos = new Float32Array(particleCount * 3);
        const partColors = new Float32Array(particleCount * 3);
        const spread = motion.particleSpread;
        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            const theta = randRange(0, Math.PI * 2);
            const phi = Math.acos(randRange(-1, 1));
            const r = randRange(0.4, spread * 1.8);
            partPos[i3] = r * Math.sin(phi) * Math.cos(theta);
            partPos[i3 + 1] = r * Math.cos(phi);
            partPos[i3 + 2] = r * Math.sin(phi) * Math.sin(theta);
            const bright = 0.2 + 0.8 * rand();
            partColors[i3] = bright; partColors[i3 + 1] = bright; partColors[i3 + 2] = bright;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(partColors, 3));
        const partMat = new THREE.PointsMaterial({ size: 0.045, vertexColors: true, transparent: true, opacity: 0.7 + 0.3 * rand(), blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true });
        const particleSystem = new THREE.Points(particleGeo, partMat);
        scene.add(particleSystem);

        // ---- rings ----
        const ringCount = randInt(3, 14);
        const rings = [];
        for (let i = 0; i < ringCount; i++) {
            const r = randRange(0.8, mainRadius * 1.4);
            const t = randRange(0.02, 0.2);
            const ringGeo = new THREE.TorusGeometry(r, t, 8, randInt(12, 64));
            const bright = 0.3 + 0.5 * rand();
            const ringMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(bright, bright, bright), transparent: true, opacity: 0.1 + 0.35 * rand(), wireframe: rand() > 0.5 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = randRange(0, Math.PI * 2);
            ring.rotation.y = randRange(0, Math.PI * 2);
            ring.userData = {
                rotSpeedX: randRange(-0.8, 0.8), rotSpeedY: randRange(-0.8, 0.8), rotSpeedZ: randRange(-0.8, 0.8),
                orbitSpeed: randRange(0.1, 0.9), orbitRadius: randRange(0.3, 3.0), phase: randRange(0, Math.PI * 2), mat: ringMat, bright,
            };
            scene.add(ring);
            rings.push(ring);
        }

        // =====================================================================
        //  ANIMATE
        // =====================================================================
        const clock = new THREE.Clock();
        const _q = new THREE.Quaternion(), _invQ = new THREE.Quaternion(), _v = new THREE.Vector3(), _m = new THREE.Matrix4();
        const _skinA = new THREE.Color(), _skinB = new THREE.Color(), _trans = new THREE.Color(), _back = new THREE.Color(), _amb = new THREE.Color();
        const WHITE = new THREE.Color(1, 1, 1);
        const lightDirsWorld = [keyLight, fillLight, rimLight].map(l => l.position.clone().normalize());
        const lightInt = [keyI, fillI, rimI];

        function feedBerry(mat, mesh) {
            const u = mat.uniforms;
            mesh.updateMatrixWorld();
            _m.copy(mesh.matrixWorld).invert();
            u.uCamM.value.copy(camera.position).applyMatrix4(_m);
            mesh.getWorldQuaternion(_q);
            _invQ.copy(_q).invert();
            for (let i = 0; i < 3; i++) {
                u.uLightDir.value[i].copy(lightDirsWorld[i]).applyQuaternion(_invQ).normalize();
                u.uLightCol.value[i].copy(_skinB).lerp(WHITE, 0.5).multiplyScalar(lightInt[i] * 0.95);
            }
            u.uAlbedo.value.copy(_skinA);
            u.uAlbedo2.value.copy(_skinB);
            u.uTransColor.value.copy(_trans);
            u.uBackdrop.value.copy(_back);
            u.uAmbient.value.copy(_amb);
        }

        let lastT = 0, bootDone = false;
        function animate() {
            const elapsed = clock.getElapsedTime();
            const dt = Math.min(0.1, elapsed - lastT); lastT = elapsed;
            controls.update();
            updateMood(dt);
            updateMutation(dt);
            updatePalette(elapsed);
            // calm seeds barely flinch when the palette lands; wild ones take the full hit
            const kick = palette.kick * ml(0.15, 1.0);

            // derive every colour the berry needs from the two palette colours
            _skinA.copy(palette.a);
            _skinB.copy(palette.b);
            _trans.copy(palette.b).lerp(palette.a, 0.5).multiplyScalar(0.75);    // juice: between the two, a little darker
            _back.copy(palette.a).multiplyScalar(0.35).lerp(palette.b, 0.15);
            _amb.copy(palette.a).lerp(WHITE, 0.5).multiplyScalar(0.3);

            bgMat.uniforms.uTime.value = elapsed;
            duotonePass.uniforms.uGrainT.value = elapsed;
            duotonePass.uniforms.uGrain.value = ml(0.004, 0.012);
            duotonePass.uniforms.uKick.value = kick;
            if (filmNoise) filmNoise.value = ml(0.03, 0.14);
            afterimagePass.uniforms['damp'].value = ml(0.80, 0.94);

            const seedChaos = motion.chaosFactor || 1.0;
            const pulseFactor = Math.sin(elapsed * motion.pulseSpeed * 0.5) * 0.5 + 0.5;
            const kickScale = 1 + kick * kick * 0.12;                      // everything flinches together when the palette lands

            mainMesh.rotation.x = elapsed * motion.rotSpeedX * 0.3 + Math.sin(elapsed * 0.2 * seedChaos) * 0.15;
            mainMesh.rotation.y = elapsed * motion.rotSpeedY * 0.3 + Math.cos(elapsed * 0.25 * seedChaos) * 0.15;
            mainMesh.rotation.z = elapsed * motion.rotSpeedZ * 0.3 + Math.sin(elapsed * 0.15) * 0.1;
            mainMesh.position.y = Math.sin(elapsed * motion.bobSpeed) * motion.bobAmp * 0.4 + Math.cos(elapsed * 1.2) * 0.05;
            mainMesh.position.x = Math.sin(elapsed * seedChaos * 0.5) * 0.3 + Math.cos(elapsed * 0.3) * 0.1;
            mainMesh.position.z = Math.sin(elapsed * 0.4) * 0.2;
            mainMesh.scale.setScalar(kickScale);
            mainMat.uniforms.uTime.value = elapsed;
            mainMat.uniforms.uPulse.value = pulseFactor;
            mainMat.uniforms.uMutate.value = mutation.v;
            feedBerry(mainMat, mainMesh);

            wireMesh.rotation.copy(mainMesh.rotation);
            wireMesh.position.copy(mainMesh.position);
            const wireScale = (1 + 0.03 * Math.sin(elapsed * 3.0)) * kickScale;
            wireMesh.scale.set(wireScale, wireScale, wireScale);

            for (const sat of satellites) {
                const { angle, radius, heightOffset, speed, phase, orbitTilt, mat } = sat.userData;
                const a = angle + elapsed * speed * 0.4 + Math.sin(elapsed * 0.1 + phase) * 0.2;
                const currentRadius = radius + Math.sin(elapsed * 0.5 + phase) * 0.4;
                sat.position.set(Math.cos(a) * currentRadius, heightOffset + Math.sin(elapsed * speed * 0.7 + phase) * 0.8 + Math.cos(elapsed * 0.3) * 0.3, Math.sin(a) * currentRadius);
                sat.rotation.x = elapsed * 0.5 + phase + orbitTilt + Math.sin(elapsed + phase);
                sat.rotation.y = elapsed * 0.3 + phase * 0.5 + Math.cos(elapsed * 0.8);
                sat.rotation.z = orbitTilt * 0.5 + Math.sin(elapsed * 0.4);
                const scale = (1 + 0.35 * Math.sin(elapsed * 0.8 + phase) * pulseFactor) * kickScale;
                sat.scale.set(scale, scale, scale);
                mat.uniforms.uTime.value = elapsed;
                if (mat.uniforms.uCamM) { mat.uniforms.uPulse.value = pulseFactor; mat.uniforms.uMutate.value = mutation.v * 0.6; feedBerry(mat, sat); }
            }

            foldGroups.forEach((group) => {
                group.children.forEach((plane) => {
                    const ud = plane.userData;
                    plane.rotation.x = Math.sin(elapsed * 0.5 + ud.foldPhase) * 1.2 + Math.sin(elapsed * 0.2) * 0.2;
                    plane.rotation.y = Math.cos(elapsed * 0.3 + ud.foldPhase) * 0.8;
                    plane.rotation.z = Math.sin(elapsed * 0.7 + ud.foldPhase) * 0.6;
                    plane.position.copy(ud.originalPos);
                    plane.position.x += Math.sin(elapsed * 0.4 + ud.foldPhase) * 10 + Math.cos(elapsed * 0.2) * 2;
                    plane.position.y += Math.cos(elapsed * 0.6 + ud.foldPhase) * 8 + Math.sin(elapsed * 0.3) * 2;
                    plane.position.z += Math.sin(elapsed * 0.8 + ud.foldPhase) * 14;
                    const b = Math.min(0.9, ud.baseBrightness * (Math.sin(elapsed * 2.5 + ud.foldPhase) * 0.35 + 0.65));
                    plane.material.color.setScalar(b);
                    plane.material.emissive.setScalar(b * (0.12 + 0.12 * Math.sin(elapsed * 0.7 + ud.foldPhase)));
                });
                group.rotation.y = Math.sin(elapsed * 0.2) * 0.4 + Math.cos(elapsed * 0.1) * 0.2;
                group.rotation.x = Math.cos(elapsed * 0.15) * 0.15;
            });

            geometricShapes.forEach((shape) => {
                const ud = shape.userData;
                shape.rotation.x += ud.rotationSpeed.x * (1 + pulseFactor * 0.5);
                shape.rotation.y += ud.rotationSpeed.y * (1 + pulseFactor * 0.5);
                shape.rotation.z += ud.rotationSpeed.z;
                shape.position.copy(ud.originalPos);
                shape.position.x += Math.sin(elapsed * 0.5 + ud.oscillationPhase) * 18 + Math.cos(elapsed * 0.3) * 4;
                shape.position.y += Math.cos(elapsed * 0.7 + ud.oscillationPhase) * 14 + Math.sin(elapsed * 0.4) * 4;
                shape.position.z += Math.sin(elapsed * 0.9 + ud.oscillationPhase) * 10;
                const b = Math.min(0.85, ud.baseBrightness * (Math.sin(elapsed * 3.5 + ud.oscillationPhase) * 0.45 + 0.55)) * 0.7;
                shape.material.color.setScalar(b);
                shape.material.emissive.setScalar(b * (0.15 + 0.15 * Math.sin(elapsed * 0.8 + ud.oscillationPhase)));
                shape.scale.setScalar((1 + Math.sin(elapsed * 2.5 + ud.oscillationPhase) * 0.4) * kickScale);
            });

            const pos = particleSystem.geometry.attributes.position.array;
            const angleStep = 0.0008 * seedChaos, cosA = Math.cos(angleStep), sinA = Math.sin(angleStep);
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const px = pos[i3], pz = pos[i3 + 2];
                pos[i3] = px * cosA - pz * sinA;
                pos[i3 + 2] = px * sinA + pz * cosA;
                pos[i3] += Math.sin(elapsed * 0.15 + i * 0.001) * 0.0008;
                pos[i3 + 1] += Math.cos(elapsed * 0.12 + i * 0.0013) * 0.0008;
                pos[i3 + 2] += Math.sin(elapsed * 0.14 + i * 0.0017) * 0.0008;
                const r = Math.sqrt(pos[i3] * pos[i3] + pos[i3 + 1] * pos[i3 + 1] + pos[i3 + 2] * pos[i3 + 2]);
                if (r > spread * 1.9 || r < spread * 0.2) { pos[i3] *= 0.97; pos[i3 + 1] *= 0.97; pos[i3 + 2] *= 0.97; }
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;
            particleSystem.rotation.y = elapsed * 0.02;
            particleSystem.rotation.x = Math.sin(elapsed * 0.01 + seedChaos) * 0.12;

            for (const ring of rings) {
                const { rotSpeedX, rotSpeedY, rotSpeedZ, orbitSpeed, orbitRadius, phase, mat, bright } = ring.userData;
                ring.rotation.x += rotSpeedX * 0.02;
                ring.rotation.y += rotSpeedY * 0.02;
                ring.rotation.z += rotSpeedZ * 0.02;
                const a = elapsed * orbitSpeed + phase;
                ring.position.x = Math.cos(a) * (orbitRadius + Math.sin(elapsed * 0.3 + phase) * 0.5) + Math.sin(elapsed * 0.25 + phase) * 0.3;
                ring.position.z = Math.sin(a) * (orbitRadius + Math.cos(elapsed * 0.3 + phase) * 0.5) + Math.cos(elapsed * 0.35 + phase) * 0.3;
                ring.position.y = Math.sin(elapsed * 0.4 + phase) * 0.6 + Math.cos(elapsed * 0.25 + phase) * 0.3;
                const sc = (1 + 0.25 * Math.sin(elapsed * 0.6 + phase) * pulseFactor) * kickScale;
                ring.scale.set(sc, sc, sc);
                mat.color.setScalar(bright * (0.7 + 0.3 * Math.sin(elapsed * 0.4 + phase)));
            }

            bloomPass.strength = (0.18 + 0.25 * (0.5 + 0.5 * Math.sin(elapsed * 0.08 + seedChaos)) * pulseFactor) * ml(0.75, 1.0) + kick * 0.6;

            composer.render();
            if (!bootDone) { bootDone = true; BOOT.done(); }        // first real frame is on screen: let the boot screen go
            requestAnimationFrame(animate);
        }

        BOOT.stage(92, 'COMPILING', 'GPU', 'berry skin  ·  duotone  ·  bloom  ·  afterimage');
        animate();

        function onResize() {
            const w = container.clientWidth, h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            composer.setSize(w, h);
            updateSeedDisplay();
        }
        window.addEventListener('resize', onResize);
        if (window.ResizeObserver) { new ResizeObserver(() => onResize()).observe(container); }

        window.__CHAOS = { seed: SEED_RAW, seed64, visitorCount, scene, camera, renderer, composer, controls, palette, mood, cycleMood, mutation, skin, shapeType, vertCount, mainMesh, mainRadius, satellites, rings, foldGroups, geometricShapes, particleSystem, wireMesh };

        console.log('CHAOS ready. Visitors:', visitorCount);
        console.log('Seed:', SEED_RAW);
        console.log('Shape type:', shapeType, 'of', SHAPE_COUNT, 'verts:', vertCount, 'radius:', mainRadius.toFixed(2));
        console.log('Lineage:', lineage.join(' → '), '| mutation rate:', mutation.rate.toFixed(4));
        console.log('Chaos factor:', motion.chaosFactor);
        console.log('Mood:', moodName(mood.v), mood.v.toFixed(2), mood.locked ? '(locked by URL)' : '(seeded)');
        console.log('Palette A/B:', '#' + palette.a.getHexString(), '#' + palette.b.getHexString());
    </script>
</body>
