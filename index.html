<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAOS</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg: #0b0b0b;
            --border: #2a2a2a;
            --text: #f0f0f0;
            --border-width: 1px;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        * {
            border: var(--border-width) solid var(--border);
        }
        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--bg);
            border: var(--border-width) solid var(--border);
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            border: var(--border-width) solid var(--border);
            background: transparent;
        }
        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            border: none;
            background: transparent;
        }
        #seed-display {
            position: fixed;
            bottom: 1.2em;
            right: 1.6em;
            z-index: 99;
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.5);
            padding: 0.3em 0.7em;
            border: var(--border-width) solid rgba(255, 255, 255, 0.06);
            font-family: 'Courier New', monospace;
            letter-spacing: 0.04em;
            pointer-events: none;
            user-select: none;
            backdrop-filter: blur(2px);
        }
        #visitor-count {
            position: fixed;
            bottom: 1.2em;
            left: 1.6em;
            z-index: 99;
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.5);
            padding: 0.3em 0.7em;
            border: var(--border-width) solid rgba(255, 255, 255, 0.06);
            font-family: 'Courier New', monospace;
            letter-spacing: 0.04em;
            pointer-events: none;
            user-select: none;
            backdrop-filter: blur(2px);
        }
        #controls {
            position: fixed;
            bottom: 1.2em;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        #mute-btn, #play-btn {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.6);
            padding: 0.4em 1em;
            border: var(--border-width) solid rgba(255, 255, 255, 0.1);
            font-family: 'Courier New', monospace;
            letter-spacing: 0.04em;
            cursor: pointer;
            user-select: none;
            backdrop-filter: blur(2px);
            transition: all 0.3s ease;
            border-radius: 4px;
        }
        #mute-btn:hover, #play-btn:hover {
            color: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 255, 255, 0.2);
        }
        #play-btn {
            color: rgba(63, 185, 80, 0.5);
            border-color: rgba(63, 185, 80, 0.15);
        }
        #play-btn:hover {
            color: rgba(63, 185, 80, 0.9);
            border-color: rgba(63, 185, 80, 0.3);
        }
        #mute-btn.active {
            color: #3fb950;
            border-color: rgba(63, 185, 80, 0.3);
        }
        ::-webkit-scrollbar {
            display: none;
        }
        @media (max-width: 600px) {
            #seed-display,
            #visitor-count,
            #mute-btn,
            #play-btn {
                font-size: 0.4rem;
                padding: 0.2em 0.5em;
                bottom: 0.8em;
            }
            #visitor-count {
                left: 0.8em;
            }
            #seed-display {
                right: 0.8em;
            }
            #controls {
                bottom: 2.8em;
                gap: 6px;
            }
        }

        #plymouth {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #0b0b0b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            transition: opacity 1.2s ease;
            opacity: 1;
            pointer-events: none;
        }
        #plymouth.hide {
            opacity: 0;
        }
        #plymouth-logo {
            font-size: 2.5rem;
            font-weight: 700;
            color: #e6edf3;
            letter-spacing: 0.15em;
            margin-bottom: 30px;
            opacity: 0;
            animation: logoFade 0.8s ease forwards 0.3s;
        }
        #plymouth-logo span {
            color: #5b7a9e;
            padding: 5px;
        }
        @keyframes logoFade {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        #plymouth-lines {
            font-size: 0.7rem;
            color: #8b949e;
            line-height: 1.8;
            text-align: left;
            max-width: 520px;
            width: 90%;
            opacity: 0;
            animation: linesFade 0.6s ease forwards 0.6s;
        }
        @keyframes linesFade {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .boot-line {
            opacity: 0;
            animation: typeLine 0.4s ease forwards;
        }
        .boot-line.success {
            color: #3fb950;
        }
        .boot-line.accent {
            color: #5b7a9e;
        }
        .boot-line.dim {
            color: #4a5568;
        }
        .boot-line .cursor {
            display: inline-block;
            width: 6px;
            height: 10px;
            background: #5b7a9e;
            vertical-align: middle;
            animation: blink 0.8s step-end infinite;
        }
        @keyframes typeLine {
            0% { opacity: 0; transform: translateX(-6px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        #plymouth-progress {
            margin-top: 25px;
            width: 240px;
            height: 2px;
            background: #1c2333;
            border-radius: 2px;
            overflow: hidden;
            opacity: 0;
            animation: linesFade 0.6s ease forwards 1.2s;
        }
        #plymouth-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3d5068, #5b7a9e, #8b949e);
            border-radius: 2px;
            transition: width 0.4s ease;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="canvas-container"></div>
        <div id="seed-display">seed: —</div>
        <div id="visitor-count">visitors: —</div>
        <div id="controls">
            <button type="button" id="play-btn">PLAY</button>
            <button type="button" id="mute-btn">muted</button>
        </div>
    </div>

    <div id="plymouth">
        <div id="plymouth-logo"> CHAOS <span> v ∞ </span></div>
        <div id="plymouth-lines">
            <div class="boot-line" style="animation-delay:0.9s;">[  INITIALIZING ENTROPY POOL  ]</div>
            <div class="boot-line" style="animation-delay:1.3s;">[  GENERATING 256-DIGIT SEED  ]</div>
            <div class="boot-line" style="animation-delay:1.7s;">[  EXTRACTING FROM Pi  ]</div>
            <div class="boot-line" style="animation-delay:2.1s;">[  SHA-512 HASHING  ]</div>
            <div class="boot-line success" style="animation-delay:2.5s;">[  SEED GENERATED  ]</div>
            <div class="boot-line accent" style="animation-delay:2.9s;">[  VISUAL ENGINE STARTING  ]</div>
            <div class="boot-line dim" style="animation-delay:3.3s;">[  SYSTEM READY  ] <span class="cursor"></span></div>
        </div>
        <div id="plymouth-progress">
            <div id="plymouth-progress-bar"></div>
        </div>
    </div>

        function decodeSongFeatures(encoded) {
            try {
                const decoded = atob(encoded);
                return JSON.parse(decoded);
            } catch (e) {
                return {};
            }
        }

        function mutateSongWithSeed(features, seed, index) {
            const seedOffset = Number((seed + BigInt(index * 999)) % 1000n);
            const mutated = { ...features };

            if (features.mean_amplitude) {
                mutated.mean_amplitude = features.mean_amplitude * (0.5 + (seedOffset % 100) / 100);
            }
            if (features.peak_frequency) {
                mutated.peak_frequency = features.peak_frequency * (0.7 + (seedOffset % 60) / 100);
            }
            if (features.duration) {
                mutated.duration = features.duration * (0.8 + (seedOffset % 40) / 100);
            }

            if (features.frequency_bands) {
                const bands = { ...features.frequency_bands };
                for (const [key, value] of Object.entries(bands)) {
                    bands[key] = value * (0.6 + ((seedOffset + key.length * 7) % 80) / 100);
                }
                mutated.frequency_bands = bands;
            }

            return mutated;
        }

        function generateAmbientFromFeatures(features, seed, index) {
            if (!audioCtx) return null;
            try {
                const mutated = mutateSongWithSeed(features, seed, index);
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const panner = audioCtx.createPanner();
                const convolver = audioCtx.createConvolver();

                let baseFreq = 180 + (index * 40) + Number(seed % 40n);
                if (mutated.peak_frequency && mutated.peak_frequency > 0) {
                    baseFreq = 60 + (mutated.peak_frequency * 100000) % 300 + (index * 25);
                }
                if (baseFreq < 50) baseFreq = 180 + (index * 40);

                const types = ['sine', 'sine', 'triangle', 'sine'];
                osc.type = types[index % 4];
                osc.frequency.value = baseFreq;

                const osc2 = audioCtx.createOscillator();
                osc2.type = 'sine';
                osc2.frequency.value = baseFreq * 1.5;
                const gain2 = audioCtx.createGain();
                gain2.gain.value = 0.08;

                const vol = 0.05 + (mutated.mean_amplitude || 3276.8) / 60000;
                gain.gain.value = Math.min(0.2, vol);

                osc2.connect(gain2);
                gain2.connect(panner);

                const lfo = audioCtx.createOscillator();
                lfo.type = 'sine';
                lfo.frequency.value = 0.05 + (index * 0.03);
                const lfoGain = audioCtx.createGain();
                lfoGain.gain.value = baseFreq * 0.05;
                lfo.connect(lfoGain);
                lfoGain.connect(osc.frequency);
                lfo.start();

                const lfo2 = audioCtx.createOscillator();
                lfo2.type = 'triangle';
                lfo2.frequency.value = 0.03 + (index * 0.02);
                const lfoGain2 = audioCtx.createGain();
                lfoGain2.gain.value = 0.1;
                lfo2.connect(lfoGain2);
                lfoGain2.connect(gain.gain);
                lfo2.start();

                panner.distanceModel = 'inverse';
                panner.refDistance = 1;
                panner.maxDistance = 25;
                panner.rolloffFactor = 0.4;

                convolver.buffer = createEchoImpulse(0.4 + index * 0.06);

                osc.connect(gain);
                gain.connect(panner);
                panner.connect(convolver);
                convolver.connect(masterGain);
                osc.start();
                osc2.start();

                return { osc, gain, panner, lfo, osc2, gain2, lfo2, convolver };
            } catch (e) {
                console.log('Ambient generation failed:', e);
                return null;
            }
        }

        function createEchoImpulse(delay) {
            const sampleRate = audioCtx.sampleRate;
            const length = sampleRate * 1.5;
            const impulse = audioCtx.createBuffer(2, length, sampleRate);
            const left = impulse.getChannelData(0);
            const right = impulse.getChannelData(1);
            
            for (let i = 0; i < length; i++) {
                const t = i / sampleRate;
                const decay = Math.exp(-t * 1.5);
                const value = (Math.random() * 2 - 1) * decay * 0.15;
                left[i] = value;
                right[i] = value * 0.7;
            }
            
            return impulse;
        }

        let audioCtx = null;
        let isMuted = true;
        let soundNodes = [];
        let listener = null;
        let masterGain = null;
        let songPlayers = [];
        let audioInitialized = false;
        let audioReady = false;

        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                listener = audioCtx.listener;
                if (listener) {
                    try {
                        if (listener.positionX !== undefined) {
                            listener.positionX.value = 0;
                            listener.positionY.value = 0;
                            listener.positionZ.value = 0;
                        } else if (listener.setPosition) {
                            listener.setPosition(0, 0, 0);
                        }
                    } catch (e) {}
                }
            } catch (e) {
                console.log('Audio not supported');
                return;
            }
            isMuted = false;
            document.getElementById('mute-btn').textContent = 'unmuted';

            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.6;
            masterGain.connect(audioCtx.destination);

            if (audioReady) {
                createObjectSounds();
                loadAndPlaySongs();
            }

            setTimeout(() => playTestTone(), 100);
            audioInitialized = true;
            console.log('Audio initialized! State:', audioCtx.state);
        }

        function toggleMute() {
            if (!audioCtx) {
                initAudio();
                return;
            }
            isMuted = !isMuted;
            document.getElementById('mute-btn').textContent = isMuted ? 'muted' : 'unmuted';
            if (isMuted) {
                if (masterGain) masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
                soundNodes.forEach(node => {
                    if (node.gain) node.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
                });
                songPlayers.forEach(p => {
                    if (p.gain) p.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
                });
            } else {
                if (masterGain) masterGain.gain.setTargetAtTime(0.6, audioCtx.currentTime, 0.3);
                if (audioCtx.state === 'suspended') audioCtx.resume();
                soundNodes.forEach(node => {
                    if (node.gain) node.gain.setTargetAtTime(node.volume || 0.08, audioCtx.currentTime, 0.3);
                });
                songPlayers.forEach(p => {
                    if (p.gain) p.gain.setTargetAtTime(p.baseVolume || 0.08, audioCtx.currentTime, 0.3);
                });
                playTestTone();
            }
        }

        function playTestTone() {
            if (!audioCtx || isMuted) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(660, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(masterGain);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {}
        }

        function createObjectSound(obj, index, size, objType) {
            if (!audioCtx) return null;
            try {
                const seedOffset = Number((seed64 + BigInt(index * 137 + objType * 999)) % 1000n);
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const panner = audioCtx.createPanner();
                const convolver = audioCtx.createConvolver();
                
                const baseFreq = 60 + (seedOffset % 200) * (0.3 + (index * 0.05));
                const sizeScale = Math.max(0.3, Math.min(2.0, size * 1.5));
                const freq = Number(baseFreq) / sizeScale;

                const type = ['sine', 'sine', 'sine', 'triangle', 'sine', 'sawtooth'][seedOffset % 6];
                osc.type = type;
                osc.frequency.value = Math.max(30, freq);

                const detuneMod = (seedOffset % 40) - 20;
                osc.detune.value = Number(detuneMod) * 0.5;

                const lfo = audioCtx.createOscillator();
                lfo.type = ['sine', 'sine', 'triangle'][seedOffset % 3];
                lfo.frequency.value = (0.02 + (seedOffset % 30) * 0.003) / sizeScale;
                const lfoGain = audioCtx.createGain();
                lfoGain.gain.value = (2 + (seedOffset % 20) * 0.2) * sizeScale;
                lfo.connect(lfoGain);
                lfoGain.connect(osc.frequency);
                lfo.start();

                const lfo2 = audioCtx.createOscillator();
                lfo2.type = 'sine';
                lfo2.frequency.value = 0.01 + (seedOffset % 20) * 0.002;
                const lfoGain2 = audioCtx.createGain();
                lfoGain2.gain.value = 0.3 + (seedOffset % 30) * 0.01;
                lfo2.connect(lfoGain2);
                lfoGain2.connect(gain.gain);
                lfo2.start();

                const volume = 0.02 + (seedOffset % 80) * 0.003 * sizeScale;

                gain.gain.value = 0.001;
                gain.gain.setTargetAtTime(volume, audioCtx.currentTime + 0.5, 0.5);

                panner.distanceModel = 'inverse';
                panner.refDistance = 0.5;
                panner.maxDistance = 30;
                panner.rolloffFactor = 0.3 + (seedOffset % 20) * 0.01;

                convolver.buffer = createEchoImpulse(0.3 + (seedOffset % 40) * 0.015);

                osc.connect(gain);
                gain.connect(panner);
                panner.connect(convolver);
                convolver.connect(masterGain);
                osc.start();

                const node = {
                    osc: osc,
                    gain: gain,
                    panner: panner,
                    lfo: lfo,
                    lfo2: lfo2,
                    convolver: convolver,
                    volume: volume,
                    index: index,
                    size: size,
                    objType: objType,
                    position: { x: 0, y: 0, z: 0 }
                };

                return node;

            } catch (e) {
                console.log('Object sound creation failed:', e);
                return null;
            }
        }

        function createObjectSounds() {
            soundNodes.forEach(node => {
                if (node.osc) { node.osc.stop(); node.osc.disconnect(); }
                if (node.gain) node.gain.disconnect();
                if (node.panner) node.panner.disconnect();
                if (node.lfo) { node.lfo.stop(); node.lfo.disconnect(); }
                if (node.lfo2) { node.lfo2.stop(); node.lfo2.disconnect(); }
                if (node.convolver) node.convolver.disconnect();
            });
            soundNodes = [];

            const allObjects = [...satellites, ...geometricShapes, ...rings];
            const count = Math.min(allObjects.length, 40);

            for (let i = 0; i < count; i++) {
                const obj = allObjects[i];
                let size = 0.5;
                let objType = 0;
                
                if (obj.geometry) {
                    const box = new THREE.Box3().setFromObject(obj);
                    const dims = box.getSize(new THREE.Vector3());
                    size = (dims.x + dims.y + dims.z) / 3;
                    
                    if (obj.geometry.type.includes('Icosahedron')) objType = 1;
                    else if (obj.geometry.type.includes('Box')) objType = 2;
                    else if (obj.geometry.type.includes('Cone')) objType = 3;
                    else if (obj.geometry.type.includes('Cylinder')) objType = 4;
                    else if (obj.geometry.type.includes('Torus')) objType = 5;
                    else objType = 0;
                }
                
                const node = createObjectSound(obj, i, size, objType);
                if (node) {
                    const angle = (i / count) * Math.PI * 2 + Number(seed64 % 10n) * 0.1;
                    const distance = 2 + (i % 8) * 0.3 + size * 0.5;
                    node.position = {
                        x: Math.cos(angle) * distance,
                        y: Math.sin(angle * 0.7 + Number(seed64 % 10n) * 0.05) * 1.5,
                        z: Math.sin(angle) * distance
                    };
                    soundNodes.push(node);
                }
            }
            console.log('Sound nodes created:', soundNodes.length);
        }

        function loadAndPlaySongs() {
            if (!audioCtx) return;

            songPlayers.forEach(p => {
                if (p.source) { p.source.stop(); p.source.disconnect(); }
                if (p.gain) p.gain.disconnect();
            });
            songPlayers = [];

            let features = {};
            try {
                if (SONG_FEATURES && SONG_FEATURES.length > 0) {
                    features = decodeSongFeatures(SONG_FEATURES);
                }
            } catch (e) {
                console.log('Failed to decode song features:', e);
            }

            const featureKeys = Object.keys(features);
            if (featureKeys.length > 0) {
                featureKeys.forEach((key, idx) => {
                    const player = generateAmbientFromFeatures(features[key], seed64, idx);
                    if (player) {
                        const baseVolume = 0.06 + Number(seed64 % 30n) * 0.002;
                        player.gain.gain.setTargetAtTime(baseVolume, audioCtx.currentTime, 0.5);

                        songPlayers.push({
                            source: player.osc,
                            gain: player.gain,
                            panner: player.panner,
                            lfo: player.lfo,
                            osc2: player.osc2,
                            gain2: player.gain2,
                            lfo2: player.lfo2,
                            convolver: player.convolver,
                            baseVolume: baseVolume,
                            index: idx,
                            isSynthetic: false
                        });
                    }
                });
            }

            if (songPlayers.length === 0) {
                generateSyntheticSongPlayers();
            }

            console.log('Song players loaded:', songPlayers.length);
        }

        function generateSyntheticSongPlayers() {
            for (let idx = 0; idx < 3; idx++) {
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const panner = audioCtx.createPanner();
                    const convolver = audioCtx.createConvolver();

                    const baseFreq = 160 + Number(seed64 % 150n) * (0.3 + idx * 0.2);
                    const type = ['sine', 'sine', 'triangle'][(Number(seed64) + idx * 5) % 3];
                    osc.type = type;
                    osc.frequency.value = Number(baseFreq);

                    const osc2 = audioCtx.createOscillator();
                    osc2.type = 'sine';
                    osc2.frequency.value = Number(baseFreq) * 1.5;
                    const gain2 = audioCtx.createGain();
                    gain2.gain.value = 0.06;

                    const lfo = audioCtx.createOscillator();
                    lfo.type = 'sine';
                    lfo.frequency.value = 0.03 + Number(seed64 % 15n) * 0.002;
                    const lfoGain = audioCtx.createGain();
                    lfoGain.gain.value = 8 + Number(seed64 % 20n) * 0.3;
                    lfo.connect(lfoGain);
                    lfoGain.connect(osc.frequency);
                    lfo.start();

                    const lfo2 = audioCtx.createOscillator();
                    lfo2.type = 'triangle';
                    lfo2.frequency.value = 0.02 + Number(seed64 % 10n) * 0.001;
                    const lfoGain2 = audioCtx.createGain();
                    lfoGain2.gain.value = 0.08;
                    lfo2.connect(lfoGain2);
                    lfoGain2.connect(gain.gain);
                    lfo2.start();

                    convolver.buffer = createEchoImpulse(0.3 + idx * 0.08);

                    const baseVolume = 0.06 + Number(seed64 % 30n) * 0.002;
                    gain.gain.value = 0.001;
                    gain.gain.setTargetAtTime(baseVolume, audioCtx.currentTime + 0.5, 0.5);

                    panner.distanceModel = 'inverse';
                    panner.refDistance = 1;
                    panner.maxDistance = 25;
                    panner.rolloffFactor = 0.4;

                    osc.connect(gain);
                    osc2.connect(gain2);
                    gain.connect(panner);
                    gain2.connect(panner);
                    panner.connect(convolver);
                    convolver.connect(masterGain);
                    osc.start();
                    osc2.start();

                    const player = {
                        source: osc,
                        gain: gain,
                        panner: panner,
                        baseVolume: baseVolume,
                        index: idx,
                        isSynthetic: true,
                        osc2: osc2,
                        gain2: gain2,
                        convolver: convolver,
                        lfo: lfo,
                        lfo2: lfo2
                    };

                    if (!isMuted) {
                        gain.gain.setTargetAtTime(baseVolume, audioCtx.currentTime, 0.5);
                    }

                    songPlayers.push(player);

                } catch (e) {
                    console.log('Synthetic song creation failed:', e);
                }
            }
        }

        function updateObjectSounds() {
            const allObjects = [...satellites, ...geometricShapes, ...rings];
            const count = Math.min(allObjects.length, soundNodes.length);

            for (let i = 0; i < count; i++) {
                const obj = allObjects[i];
                const node = soundNodes[i];
                if (obj && node && node.panner) {
                    const pos = new THREE.Vector3();
                    obj.getWorldPosition(pos);

                    const distance = pos.length();

                    node.panner.positionX.value = pos.x;
                    node.panner.positionY.value = pos.y;
                    node.panner.positionZ.value = pos.z;

                    const sizeScale = Math.max(0.3, Math.min(2.0, node.size * 1.5));
                    const freqMod = 1 + (distance * 0.015) / sizeScale;
                    const freq = Math.max(30, (60 + (node.index * 8)) * freqMod);
                    node.osc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.2);

                    const volumeScale = Math.max(0.05, Math.min(1, 1 / (1 + distance * 0.04)));
                    const targetVol = node.volume * volumeScale * 1.5 * sizeScale;
                    node.gain.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.2);

                    const rate = (0.02 + (distance * 0.002)) / sizeScale;
                    node.lfo.frequency.setTargetAtTime(rate, audioCtx.currentTime, 0.3);
                }
            }

            songPlayers.forEach((player, idx) => {
                if (player.panner) {
                    const time = performance.now() / 1000;
                    const angle = (idx / 3) * Math.PI * 2 + time * 0.008;
                    const distance = 5 + idx * 0.5 + Math.sin(time * 0.015 + idx) * 0.5;
                    player.panner.positionX.value = Math.cos(angle) * distance;
                    player.panner.positionZ.value = Math.sin(angle) * distance;
                    player.panner.positionY.value = Math.sin(angle * 0.5 + time * 0.008) * 1;

                    const vol = player.baseVolume * (0.85 + 0.15 * Math.sin(time * 0.025 + idx));
                    if (!isMuted && player.gain) {
                        player.gain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.5);
                        if (player.gain2) {
                            player.gain2.gain.setTargetAtTime(vol * 0.4, audioCtx.currentTime, 0.5);
                        }
                    }

                    if (player.isSynthetic) {
                        const freqMod = 1 + 0.08 * Math.sin(time * 0.015 + idx);
                        player.source.frequency.setTargetAtTime(Number(80 + Number(seed64 % 150n) * (0.3 + idx * 0.2)) * freqMod, audioCtx.currentTime, 0.3);
                    }
                }
            });
        }

        const BASE_SEED = '00000000000000000000000000000000';
        const SEED_RAW = BASE_SEED + String(visitorCount).padStart(10, '0');

        function splitmix64(a) {
            return function() {
                a = (a + 0x9E3779B97F4A7C15n) & 0xFFFFFFFFFFFFFFFFn;
                let z = a;
                z = ((z ^ (z >> 30n)) * 0xBF58476D1CE4E5B9n) & 0xFFFFFFFFFFFFFFFFn;
                z = ((z ^ (z >> 27n)) * 0x94D049BB133111EBn) & 0xFFFFFFFFFFFFFFFFn;
                return Number((z ^ (z >> 31n)) & 0xFFFFFFFFFFFFFFFFn) / 18446744073709551616;
            };
        }

        function seedTo64(s) {
            let h1 = 0n, h2 = 0n;
            const str = String(s);
            for (let i = 0; i < str.length; i++) {
                const c = BigInt(str.charCodeAt(i));
                if (i < str.length / 2) {
                    h1 = ((h1 << 8n) + c) & 0xFFFFFFFFFFFFFFFFn;
                } else {
                    h2 = ((h2 << 8n) + c) & 0xFFFFFFFFFFFFFFFFn;
                }
            }
            return (h1 ^ (h2 << 32n)) & 0xFFFFFFFFFFFFFFFFn;
        }

        const seed64 = seedTo64(SEED_RAW);
        const rng = splitmix64(seed64);

        document.getElementById('seed-display').textContent = 'seed: ' + SEED_RAW.slice(0, 20) + '...';

        function rand() { return rng(); }
        function randRange(min, max) { return min + (max - min) * rand(); }
        function randInt(min, max) { return Math.floor(randRange(min, max + 1)); }

        function seededColor() {
            const hue = rand();
            const sat = 0.65 + 0.35 * rand();
            const light = 0.40 + 0.45 * rand();
            return new THREE.Color().setHSL(hue, sat, light);
        }

        function seededColorPair() {
            const h1 = rand();
            const h2 = (h1 + 0.3 + 0.5 * rand()) % 1.0;
            const s1 = 0.60 + 0.40 * rand();
            const s2 = 0.60 + 0.40 * rand();
            const l1 = 0.35 + 0.50 * rand();
            const l2 = 0.35 + 0.50 * rand();
            return {
                a: new THREE.Color().setHSL(h1, s1, l1),
                b: new THREE.Color().setHSL(h2, s2, l2),
            };
        }

        function getBgColors() {
            const h1 = rand();
            const h2 = (h1 + 0.4 + 0.4 * rand()) % 1.0;
            const s1 = 0.50 + 0.40 * rand();
            const s2 = 0.50 + 0.40 * rand();
            const l1 = 0.04 + 0.10 * rand();
            const l2 = 0.04 + 0.10 * rand();
            return {
                top: new THREE.Color().setHSL(h1, s1, l1),
                bottom: new THREE.Color().setHSL(h2, s2, l2),
            };
        }

        function getGeoParams() {

            return { type, radius, tube, radialSeg, tubularSeg, p, q, width, height, depth, detail };
        }

        function getMotionParams() {

        }

        const container = document.getElementById('canvas-container');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0b);

        const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 200);
        camera.position.set(0, 1.2, 7);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,

        const controls = new OrbitControls(camera, renderer.domElement);

        controls.enableZoom = true;
        controls.enablePan = false;

        controls.maxPolarAngle = Math.PI / 2;
        controls.minPolarAngle = 0;

        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(width, height),

        );
        composer.addPass(bloomPass);

        const filmPass = new FilmPass(0.35, 0.025, 648, false);
        composer.addPass(filmPass);

        const afterimagePass = new AfterimagePass(0.96);
        afterimagePass.renderToScreen = true;
        composer.addPass(afterimagePass);

        const ambientLight = new THREE.AmbientLight(0x222244, 0.5);
        scene.add(ambientLight);

        const lightColor = seededColor();
        const lightPos = new THREE.Vector3(
            randRange(-8, 8),
            randRange(-8, 8),
            randRange(-8, 8)
        );
        const dirLight = new THREE.DirectionalLight(lightColor, 2.5);
        dirLight.position.copy(lightPos);
        scene.add(dirLight);

        const lightColor2 = seededColor();
        const lightPos2 = new THREE.Vector3(
            randRange(-8, 8),

            randRange(-8, 8)
        );
        const dirLight2 = new THREE.DirectionalLight(lightColor2, 1.5);
        dirLight2.position.copy(lightPos2);
        scene.add(dirLight2);

        const bgColors = getBgColors();
        const bgGeo = new THREE.SphereGeometry(80, 32, 32);
        const bgMat = new THREE.ShaderMaterial({
            side: THREE.BackSide,
            uniforms: {
                uColorTop: { value: bgColors.top },

                uTime: { value: 0 },
                uSeed: { value: Number(seed64 & 0xFFFFFFFFn) },
            },
            vertexShader: `
            varying vec3 vPos;

            fragmentShader: `
            uniform vec3 uColorTop;
            uniform vec3 uColorBottom;
            uniform float uTime;
            uniform float uSeed;
            varying vec3 vPos;
            float hash(vec3 p) {
              p = fract(p * 0.3183099 + 0.1);
              p *= 17.0;
              return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
            }
            float noise(vec3 p) {
              vec3 i = floor(p);
              vec3 f = fract(p);
              f = f * f * (3.0 - 2.0 * f);
              return mix(
                mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x),
                    mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                    mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
            }
            void main() {
              vec3 dir = normalize(vPos);
              float t = 0.5 + 0.5 * dir.y;
              float wave = sin(dir.x * 3.0 + uTime * 0.08) * 0.08
                         + cos(dir.z * 3.0 + uTime * 0.06) * 0.08;
              t = clamp(t + wave, 0.0, 1.0);
              float n = noise(dir * 2.0 + uTime * 0.02) * 0.06;
              t = clamp(t + n, 0.0, 1.0);
              vec3 col = mix(uColorBottom, uColorTop, t);
              float v = 1.0 - 0.3 * length(dir.xy);
              col *= v;
              gl_FragColor = vec4(col, 1.0);
            }
          `
        });
        const bgMesh = new THREE.Mesh(bgGeo, bgMat);
        scene.add(bgMesh);

        const geoParams = getGeoParams();
        let mainGeo;
        switch (geoParams.type) {
            case 0:
                mainGeo = new THREE.TorusKnotGeometry(
                    geoParams.radius, geoParams.tube,

                break;
            case 1:
                mainGeo = new THREE.TorusGeometry(

                break;
            case 10:
                mainGeo = new THREE.PlaneGeometry(geoParams.width, geoParams.height, geoParams.radialSeg, geoParams.tubularSeg);
                break;
            case 11:
                mainGeo = new THREE.LatheGeometry(
                    Array.from({ length: 10 }, (_, i) => new THREE.Vector2(
                        randRange(0.2, 1.0),
                        (i / 9) * geoParams.height - geoParams.height / 2
                    )),
                    geoParams.radialSeg
                );
                break;
            case 12:
                mainGeo = new THREE.ParametricGeometry((u, v, target) => {
                    const x = u * geoParams.width - geoParams.width / 2;
                    const z = v * geoParams.depth - geoParams.depth / 2;
                    const y = Math.sin(u * Math.PI * 3) * Math.cos(v * Math.PI * 3) * geoParams.height / 2;
                    target.set(x, y, z);
                }, geoParams.radialSeg, geoParams.tubularSeg);
                break;
            default:

        }

        const posAttr = mainGeo.attributes.position;
        const vertCount = posAttr.count;
        const disp = new Float32Array(vertCount);
        for (let i = 0; i < vertCount; i++) {
            disp[i] = randRange(-0.4, 0.4);
        }
        const origPos = posAttr.array.slice();
        for (let i = 0; i < vertCount; i++) {
            const i3 = i * 3;
            const x = origPos[i3];
            const y = origPos[i3 + 1];
            const z = origPos[i3 + 2];
            const len = Math.sqrt(x * x + y * y + z * z) || 1;
            const d = disp[i] * 0.8;
            posAttr.array[i3] = x + (x / len) * d;
            posAttr.array[i3 + 1] = y + (y / len) * d;
            posAttr.array[i3 + 2] = z + (z / len) * d;

        const colorPair = seededColorPair();

            uniforms: {
                uTime: { value: 0 },
                uColorA: { value: colorPair.a },
                uColorB: { value: colorPair.b },
                uPulseSpeed: { value: motion.pulseSpeed },
                uPulseAmp: { value: motion.pulseAmp },
                uWaveSpeed: { value: motion.waveSpeed },
                uWaveAmp: { value: motion.waveAmp },
                uChaos: { value: motion.chaosFactor },
                uInvert: { value: shouldInvert ? 1 : 0 },
                uBrightness: { value: 1 + brightnessOffset },
                uSeed: { value: Number(seed64 & 0xFFFFFFFFn) },
            },
            vertexShader: `
            uniform float uTime;
            uniform float uWaveSpeed;
            uniform float uWaveAmp;
            uniform float uChaos;
            varying vec3 vNormal;
            varying vec3 vPos;
            varying float vDisplacement;
            float hash(vec3 p) {
              p = fract(p * 0.3183099 + 0.1);
              p *= 17.0;
              return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
            }
            float noise(vec3 p) {
              vec3 i = floor(p);
              vec3 f = fract(p);
              f = f * f * (3.0 - 2.0 * f);
              return mix(
                mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x),
                    mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
                mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x),
                    mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
            }
            void main() {
              vec3 pos = position;
              float n = noise(pos * 1.2 + uTime * uWaveSpeed * 0.3);
              float wave = sin(pos.x * 2.0 + uTime * uWaveSpeed) * uWaveAmp * 0.3
                         + cos(pos.y * 2.0 + uTime * uWaveSpeed * 0.7) * uWaveAmp * 0.3
                         + sin(pos.z * 2.0 + uTime * uWaveSpeed * 0.5) * uWaveAmp * 0.3;
              float chaos = sin(pos.x * uChaos + uTime * 0.5) * 0.3 +
                           cos(pos.y * uChaos + uTime * 0.7) * 0.3 +
                           sin(pos.z * uChaos + uTime * 0.3) * 0.3;
              float d = n * 0.25 + wave * 0.2 + chaos * 0.15;
              pos += normal * d;
              vDisplacement = d;
              vNormal = normalize(normalMatrix * normal);
              vPos = pos;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
          `,
            fragmentShader: `
            uniform vec3 uColorA;
            uniform vec3 uColorB;
            uniform float uTime;
            uniform float uPulseSpeed;
            uniform float uPulseAmp;
            uniform float uChaos;
            uniform float uInvert;
            uniform float uBrightness;
            varying vec3 vNormal;
            varying vec3 vPos;
            varying float vDisplacement;
            void main() {
              float pulse = 0.5 + 0.5 * sin(uTime * uPulseSpeed);
              float chaosMod = 0.5 + 0.5 * sin(uTime * uChaos * 0.3);
              float mixVal = 0.5 + 0.5 * vDisplacement * 2.0 + pulse * uPulseAmp + chaosMod * 0.3;
              mixVal = clamp(mixVal, 0.0, 1.0);
              vec3 col = mix(uColorA, uColorB, mixVal);
              vec3 viewDir = normalize(cameraPosition - vPos);
              float fresnel = pow(1.0 - max(dot(viewDir, vNormal), 0.0), 2.5);
              col += fresnel * 0.6 * mix(uColorA, uColorB, 0.5);
              float rim = 1.0 - abs(dot(viewDir, vNormal));
              col += rim * 0.15 * vec3(0.8, 0.9, 1.0);
              float chaosGlow = 0.5 + 0.5 * sin(uTime * uChaos + vPos.x * 2.0 + vPos.y * 3.0);
              col += chaosGlow * 0.08 * vec3(0.5, 0.8, 1.0);
              col = mix(col, 1.0 - col, uInvert);
              col *= uBrightness;
              gl_FragColor = vec4(col, 0.92);
            }
          `,
            transparent: true,
            side: THREE.DoubleSide,
            wireframe: false,
        });

        const mainMesh = new THREE.Mesh(mainGeo, mainMat);
        scene.add(mainMesh);

        const wireMat = new THREE.MeshBasicMaterial({
            color: 0x88aaff,
            wireframe: true,
            transparent: true,
            opacity: 0.08,
        });
        const wireMesh = new THREE.Mesh(mainGeo.clone(), wireMat);
        wireMesh.scale.set(1.01, 1.01, 1.01);
        scene.add(wireMesh);

        const satelliteCount = randInt(5, 25);
        const satellites = [];
        for (let i = 0; i < satelliteCount; i++) {
            const c = seededColor();
            const satBrightness = 0.3 + 0.7 * rand();
            const satInvert = rand() > 0.5;
            const size = randRange(0.04, 0.35);
            const geoType = randInt(0, 4);
            let satGeo;
            switch (geoType) {
                case 0:
                    satGeo = new THREE.IcosahedronGeometry(size, randInt(0, 2));
                    break;
                case 1:
                    satGeo = new THREE.OctahedronGeometry(size);
                    break;
                case 2:
                    satGeo = new THREE.DodecahedronGeometry(size);
                    break;
                case 3:
                    satGeo = new THREE.BoxGeometry(size, size * randRange(0.5, 2), size * randRange(0.5, 2));
                    break;
                case 4:
                    satGeo = new THREE.TetrahedronGeometry(size);
                    break;
            }
            const satMat = new THREE.MeshStandardMaterial({
                color: c,
                emissive: c,
                emissiveIntensity: 0.3 + 0.5 * rand(),
                roughness: 0.1 + 0.8 * rand(),
                metalness: 0.1 + 0.9 * rand(),
            });
            const sat = new THREE.Mesh(satGeo, satMat);
            const angle = randRange(0, Math.PI * 2);
            const radius = randRange(1.8, 6.0);
            const heightOffset = randRange(-2.0, 2.0);
            const speed = randRange(0.1, 2.0);
            const phase = randRange(0, Math.PI * 2);
            const orbitTilt = randRange(-0.8, 0.8);
            sat.userData = {
                angle, radius, heightOffset, speed, phase, orbitTilt,
                brightness: satBrightness,
                invert: satInvert,
                baseColor: c.clone(),
            };
            if (satInvert) {
                sat.material.color.setRGB(1 - c.r, 1 - c.g, 1 - c.b);
                sat.material.emissive.setRGB(1 - c.r * 0.3, 1 - c.g * 0.3, 1 - c.b * 0.3);
            }
            sat.material.color.multiplyScalar(satBrightness);
            sat.material.emissive.multiplyScalar(satBrightness);
            scene.add(sat);
            satellites.push(sat);
        }

        const foldGroups = [];
        const foldCount = randInt(4, 12);
        for (let i = 0; i < foldCount; i++) {
            const foldGroup = new THREE.Group();
            const planesPerGroup = randInt(3, 8);
            for (let j = 0; j < planesPerGroup; j++) {
                const w = randRange(4, 12);
                const h = randRange(4, 16);
                const segW = randInt(2, 6);
                const segH = randInt(2, 6);
                const geometry = new THREE.PlaneGeometry(w, h, segW, segH);
                const brightness = 0.2 + rand() * 0.8;
                const c = seededColor();
                const material = new THREE.MeshPhongMaterial({
                    color: c,
                    transparent: true,
                    opacity: 0.7 + 0.3 * rand(),
                    side: THREE.DoubleSide,
                    shininess: 50 + rand() * 150,
                    emissive: c.clone().multiplyScalar(0.2 + rand() * 0.3),
                });
                const plane = new THREE.Mesh(geometry, material);
                plane.position.set(
                    randRange(-30, 30),
                    randRange(-20, 20),
                    randRange(-30, 30)
                );
                plane.userData = {
                    originalPos: plane.position.clone(),
                    foldPhase: randRange(0, Math.PI * 4),
                    baseBrightness: brightness,
                };
                foldGroup.add(plane);
            }
            foldGroups.push(foldGroup);
            scene.add(foldGroup);
        }

        const geometricShapes = [];
        const shapeCount = randInt(10, 30);
        for (let i = 0; i < shapeCount; i++) {
            const type = randInt(0, 5);
            let geometry;
            switch (type) {
                case 0:
                    geometry = new THREE.ConeGeometry(randRange(1, 4), randRange(3, 10), randInt(3, 8));
                    break;
                case 1:
                    geometry = new THREE.BoxGeometry(randRange(2, 6), randRange(1, 4), randRange(4, 12));
                    break;
                case 2:
                    geometry = new THREE.CylinderGeometry(randRange(0.5, 3), randRange(1, 5), randRange(4, 12), randInt(4, 10));
                    break;
                case 3:
                    geometry = new THREE.TorusGeometry(randRange(1, 4), randRange(0.2, 1), randInt(8, 24), randInt(8, 24));
                    break;
                case 4:
                    geometry = new THREE.IcosahedronGeometry(randRange(1, 4), randInt(0, 2));
                    break;
                case 5:
                    geometry = new THREE.DodecahedronGeometry(randRange(1, 4));
                    break;
            }
            const brightness = 0.3 + rand() * 0.7;
            const c = seededColor();
            const material = new THREE.MeshPhongMaterial({
                color: c,
                transparent: true,
                opacity: 0.6 + 0.4 * rand(),
                shininess: 50 + rand() * 150,
                emissive: c.clone().multiplyScalar(0.1 + rand() * 0.3),
            });
            const shape = new THREE.Mesh(geometry, material);
            shape.position.set(
                randRange(-40, 40),
                randRange(-30, 30),
                randRange(-40, 40)
            );
            shape.userData = {
                originalPos: shape.position.clone(),
                rotationSpeed: new THREE.Vector3(
                    randRange(-0.03, 0.03),
                    randRange(-0.03, 0.03),
                    randRange(-0.03, 0.03)
                ),
                oscillationPhase: randRange(0, Math.PI * 2),
                baseBrightness: brightness,
            };
            geometricShapes.push(shape);
            scene.add(shape);
        }

        const particleCount = randInt(3000, 20000);
        const particleGeo = new THREE.BufferGeometry();
        const partPos = new Float32Array(particleCount * 3);
        const partColors = new Float32Array(particleCount * 3);
        const partSizes = new Float32Array(particleCount);
        const spread = motion.particleSpread;
        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            const theta = randRange(0, Math.PI * 2);
            const phi = Math.acos(randRange(-1, 1));
            const r = randRange(0.4, spread * 1.8);
            partPos[i3] = r * Math.sin(phi) * Math.cos(theta);
            partPos[i3 + 1] = r * Math.cos(phi);
            partPos[i3 + 2] = r * Math.sin(phi) * Math.sin(theta);
            const c = seededColor();
            const bright = 0.2 + 0.8 * rand();
            const invert = rand() > 0.5;
            partColors[i3] = invert ? (1 - c.r) * bright : c.r * bright;
            partColors[i3 + 1] = invert ? (1 - c.g) * bright : c.g * bright;
            partColors[i3 + 2] = invert ? (1 - c.b) * bright : c.b * bright;
            partSizes[i] = randRange(0.01, 0.15);
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(partColors, 3));
        particleGeo.setAttribute('size', new THREE.BufferAttribute(partSizes, 1));

        const partMat = new THREE.PointsMaterial({
            size: 0.035,
            vertexColors: true,
            transparent: true,
            opacity: 0.7 + 0.3 * rand(),
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            sizeAttenuation: true,
        });
        const particleSystem = new THREE.Points(particleGeo, partMat);
        scene.add(particleSystem);

        const ringCount = randInt(3, 12);
        const rings = [];
        for (let i = 0; i < ringCount; i++) {
            const r = randRange(0.5, 3.0);
            const t = randRange(0.02, 0.15);
            const seg = randInt(12, 64);
            const ringGeo = new THREE.TorusGeometry(r, t, 8, seg);
            const c = seededColor();
            const bright = 0.3 + 0.7 * rand();
            const invert = rand() > 0.5;
            const ringMat = new THREE.MeshBasicMaterial({
                color: invert ? new THREE.Color(1 - c.r, 1 - c.g, 1 - c.b).multiplyScalar(bright) : c.clone().multiplyScalar(bright),
                transparent: true,
                opacity: 0.1 + 0.3 * rand(),
                wireframe: rand() > 0.5,
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = randRange(0, Math.PI * 2);
            ring.rotation.y = randRange(0, Math.PI * 2);
            ring.position.set(
                randRange(-2.0, 2.0),
                randRange(-1.0, 1.0),
                randRange(-2.0, 2.0)
            );
            ring.userData = {
                rotSpeedX: randRange(-0.8, 0.8),
                rotSpeedY: randRange(-0.8, 0.8),
                rotSpeedZ: randRange(-0.8, 0.8),
                orbitSpeed: randRange(0.1, 0.9),
                orbitRadius: randRange(0.3, 2.2),
                phase: randRange(0, Math.PI * 2),
            };
            scene.add(ring);
            rings.push(ring);
        }

        const cloudTexture = new THREE.CanvasTexture((() => {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.4, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return canvas;
        })());

        const cloudShader = {
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D map;
                uniform vec3 fogColor;
                uniform float fogNear;
                uniform float fogFar;
                varying vec2 vUv;
                void main() {
                    float depth = gl_FragCoord.z / gl_FragCoord.w;
                    float fogFactor = smoothstep(fogNear, fogFar, depth);
                    gl_FragColor = texture2D(map, vUv);
                    gl_FragColor.w *= pow(gl_FragCoord.z, 20.0);
                    gl_FragColor = mix(gl_FragColor, vec4(fogColor, gl_FragColor.w), fogFactor);
                }
            `
        };

        const cloudFog = new THREE.Fog(0x4584b4, -100, 3000);
        const cloudMat = new THREE.ShaderMaterial({
            uniforms: {
                map: { value: cloudTexture },
                fogColor: { value: cloudFog.color },
                fogNear: { value: cloudFog.near },
                fogFar: { value: cloudFog.far }
            },
            vertexShader: cloudShader.vertexShader,
            fragmentShader: cloudShader.fragmentShader,
            depthWrite: false,
            depthTest: false,
            transparent: true
        });

        const cloudCount = randInt(2000, 8000);
        const cloudGeos = [];
        for (let i = 0; i < cloudCount; i++) {
            const planeGeo = new THREE.PlaneGeometry(
                randRange(20, 80),
                randRange(20, 80)
            );
            const obj = new THREE.Object3D();
            obj.position.set(
                randRange(-500, 500),
                randRange(-200, -20),
                randRange(-500, 500)
            );
            obj.rotation.z = randRange(0, Math.PI * 2);
            const sc = randRange(0.5, 2.0);
            obj.scale.set(sc, sc, sc);
            obj.updateMatrix();
            const clone = planeGeo.clone();
            clone.applyMatrix4(obj.matrix);
            cloudGeos.push(clone);
        }
        const mergedClouds = mergeGeometries(cloudGeos);
        const cloudMesh = new THREE.Mesh(mergedClouds, cloudMat);
        cloudMesh.renderOrder = 0;
        scene.add(cloudMesh);

        const cloudMesh2 = cloudMesh.clone();
        cloudMesh2.position.z = -2000;
        cloudMesh2.renderOrder = 0;
        scene.add(cloudMesh2);

        const clock = new THREE.Clock();

        function animate() {
            const elapsed = clock.getElapsedTime();

            controls.update();

            if (audioCtx && !isMuted && soundNodes.length > 0) {
                updateObjectSounds();
            }

            bgMat.uniforms.uTime.value = elapsed;
            mainMat.uniforms.uTime.value = elapsed;

            mainMesh.rotation.x = elapsed * motion.rotSpeedX * 0.3;
            mainMesh.rotation.y = elapsed * motion.rotSpeedY * 0.3;
            mainMesh.rotation.z = elapsed * motion.rotSpeedZ * 0.3;
            const bob = Math.sin(elapsed * motion.bobSpeed) * motion.bobAmp * 0.4;
            mainMesh.position.y = bob;
            const chaosOffset = Math.sin(elapsed * motion.chaosFactor * 0.5) * 0.3;
            mainMesh.position.x = chaosOffset;

            wireMesh.rotation.copy(mainMesh.rotation);
            wireMesh.position.copy(mainMesh.position);

            for (const sat of satellites) {
                const { angle, radius, heightOffset, speed, phase, orbitTilt, brightness, invert, baseColor } = sat.userData;
                const a = angle + elapsed * speed * 0.5;
                const x = Math.cos(a) * radius;
                const z = Math.sin(a) * radius;
                const y = heightOffset + Math.sin(elapsed * speed * 0.7 + phase) * 0.6;
                sat.position.set(x, y, z);
                sat.rotation.x = elapsed * 0.5 + phase + orbitTilt;
                sat.rotation.y = elapsed * 0.3 + phase * 0.5;
                sat.rotation.z = orbitTilt * 0.5;
                const scale = 1 + 0.25 * Math.sin(elapsed * 0.6 + phase);
                sat.scale.set(scale, scale, scale);

                const brightPulse = 0.7 + 0.3 * Math.sin(elapsed * 0.5 + phase);
                const finalBright = brightness * brightPulse;
                if (invert) {
                    sat.material.color.setRGB(1 - baseColor.r, 1 - baseColor.g, 1 - baseColor.b);
                } else {
                    sat.material.color.copy(baseColor);
                }
                sat.material.color.multiplyScalar(finalBright);
                sat.material.emissive.copy(sat.material.color).multiplyScalar(0.3);
            }

            foldGroups.forEach((group) => {
                group.children.forEach((plane) => {
                    const userData = plane.userData;
                    const foldAmount = Math.sin(elapsed * 0.5 + userData.foldPhase) * 0.8;
                    plane.rotation.x = foldAmount;
                    plane.rotation.y = Math.cos(elapsed * 0.3 + userData.foldPhase) * 0.6;
                    plane.rotation.z = Math.sin(elapsed * 0.7 + userData.foldPhase) * 0.4;
                    plane.position.copy(userData.originalPos);
                    plane.position.x += Math.sin(elapsed * 0.4 + userData.foldPhase) * 8;
                    plane.position.y += Math.cos(elapsed * 0.6 + userData.foldPhase) * 6;
                    plane.position.z += Math.sin(elapsed * 0.8 + userData.foldPhase) * 12;
                    const brightnessModulation = Math.sin(elapsed * 2 + userData.foldPhase) * 0.3 + 0.7;
                    const brightness = userData.baseBrightness * brightnessModulation;
                    plane.material.color.setRGB(brightness, brightness, brightness);
                    plane.material.emissive.setRGB(brightness * 0.3, brightness * 0.3, brightness * 0.3);
                });
                group.rotation.y = Math.sin(elapsed * 0.2) * 0.3;
            });

            geometricShapes.forEach((shape) => {
                const userData = shape.userData;
                shape.rotation.x += userData.rotationSpeed.x;
                shape.rotation.y += userData.rotationSpeed.y;
                shape.rotation.z += userData.rotationSpeed.z;
                shape.position.copy(userData.originalPos);
                shape.position.x += Math.sin(elapsed * 0.5 + userData.oscillationPhase) * 15;
                shape.position.y += Math.cos(elapsed * 0.7 + userData.oscillationPhase) * 12;
                shape.position.z += Math.sin(elapsed * 0.9 + userData.oscillationPhase) * 8;
                const brightnessModulation = Math.sin(elapsed * 3 + userData.oscillationPhase) * 0.4 + 0.6;
                const brightness = userData.baseBrightness * brightnessModulation;
                shape.material.color.setRGB(brightness, brightness, brightness);
                shape.material.emissive.setRGB(brightness * 0.2, brightness * 0.2, brightness * 0.2);
                const scale = 1 + Math.sin(elapsed * 2 + userData.oscillationPhase) * 0.3;
                shape.scale.setScalar(scale);
            });

            const pos = particleSystem.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                pos[i3] += Math.sin(elapsed * 0.1 + i * 0.001 + motion.chaosFactor) * 0.0006;
                pos[i3 + 1] += Math.cos(elapsed * 0.08 + i * 0.0013 + motion.chaosFactor) * 0.0006;
                pos[i3 + 2] += Math.sin(elapsed * 0.09 + i * 0.0017 + motion.chaosFactor) * 0.0006;
                const r = Math.sqrt(pos[i3] * pos[i3] + pos[i3 + 1] * pos[i3 + 1] + pos[i3 + 2] * pos[i3 + 2]);
                if (r > spread * 1.8) {
                    pos[i3] *= 0.98;
                    pos[i3 + 1] *= 0.98;
                    pos[i3 + 2] *= 0.98;
                }
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;
            particleSystem.rotation.y = elapsed * 0.015;
            particleSystem.rotation.x = Math.sin(elapsed * 0.008 + motion.chaosFactor) * 0.08;

            for (const ring of rings) {
                const { rotSpeedX, rotSpeedY, rotSpeedZ, orbitSpeed, orbitRadius, phase } = ring.userData;
                ring.rotation.x += rotSpeedX * 0.015;
                ring.rotation.y += rotSpeedY * 0.015;
                ring.rotation.z += rotSpeedZ * 0.015;
                const a = elapsed * orbitSpeed + phase;
                ring.position.x = Math.cos(a) * orbitRadius + Math.sin(elapsed * 0.2 + phase) * 0.2;
                ring.position.z = Math.sin(a) * orbitRadius + Math.cos(elapsed * 0.3 + phase) * 0.2;
                ring.position.y = Math.sin(elapsed * 0.3 + phase) * 0.4 + Math.cos(elapsed * 0.2 + phase) * 0.2;
                const sc = 1 + 0.15 * Math.sin(elapsed * 0.4 + phase);
                ring.scale.set(sc, sc, sc);
            }

            const cloudPos = ((Date.now() - Date.now()) * 0.03) % 8000;
            cloudMesh.position.z = -cloudPos + 4000;
            cloudMesh2.position.z = -cloudPos + 2000;

            bloomPass.strength = 0.2 + 0.4 * (0.5 + 0.5 * Math.sin(elapsed * 0.05 + motion.chaosFactor));

            composer.render();
            requestAnimationFrame(animate);
        }

        animate();

        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            composer.setSize(w, h);

            if (audioCtx && listener) {
                try {
                    if (listener.positionX !== undefined) {
                        listener.positionX.value = 0;
                        listener.positionY.value = 0;
                        listener.positionZ.value = 0;
                    } else if (listener.setPosition) {
                        listener.setPosition(0, 0, 0);
                    }
                } catch (e) {}
            }
        }
        window.addEventListener('resize', onResize);
        if (window.ResizeObserver) {
            const ro = new ResizeObserver(function() { onResize(); });
            ro.observe(container);
        }

        window.__CHAOS = {
            seed: SEED_RAW,
            seed64: seed64,
            visitorCount: visitorCount,
            scene: scene,
            camera: camera,
            renderer: renderer,
            composer: composer,
            controls: controls,
        };

        console.log('CHAOS ready. Visitors:', visitorCount);
        console.log('Seed:', SEED_RAW);
        console.log('Geometry type:', geoParams.type);
        console.log('Chaos factor:', motion.chaosFactor);
        console.log('Light position:', lightPos.x.toFixed(2), lightPos.y.toFixed(2), lightPos.z.toFixed(2));
    </script>
</body>
</html>
