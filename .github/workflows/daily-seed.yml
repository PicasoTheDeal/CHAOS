name: Generate and Deploy Daily Seed

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate seed and update HTML
        run: node generate-seed.js

      - name: Commit and push daily seed updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: index.html daily-seed.json
          commit_message: "chore: update daily seed and index [skip ci]"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy . --project-name=controlled-chaos --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
